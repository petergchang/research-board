  if (e.target.classList && e.target.classList.contains('linkact')){ const v = e.target.value; e.target.value = ''; const t = e.target.dataset.for ? document.getElementById(e.target.dataset.for) : (document.getElementById(lastNoteTA) || $('#noteedit')); if (v && t){ insertAtCaret(t, '#' + v); autoGrow(t); } return; }
  if (e.target.classList && e.target.classList.contains('crittag')){
    const v = e.target.value; const st = find(state.stages, e.target.dataset.stage); const n = Number(e.target.dataset.n); if (!v || !st) return;
    const id = v.replace(/^-/, ''); const drop = v.startsWith('-');
    st.criteria = mdEditTask(st.criteria, n, line => drop ? line.replace(new RegExp('\\s*#' + id + '(?![\\w])', 'g'), '') : line.replace(/\s+$/, '') + ' #' + id);
    st.updated = stampNow(); commit(); toast(drop ? 'Tag removed.' : 'Tagged ' + id + '.'); return;
  }
  if (e.target.classList && e.target.classList.contains('status-sel')){
    const kind = e.target.dataset.kind, id = e.target.dataset.id, v = e.target.value;
    const t = kind === 'stage' ? find(state.stages, id) : find(state.activities, id);
    if (t){ t.status = v; t.updated = stampNow(); commit(); }
    return;
  }
  const f = e.target.closest('#logform'); if (!f) return;
  if (e.target.name === 'kind'){ for (const k of ['result','decision','note']) $('#f-' + k).hidden = (k !== e.target.value); const t = $('#f-' + e.target.value + ' textarea'); if (t) t.focus(); }
  if (e.target.name === 'activity') fillPropagate();
  if (e.target.name === 'stage') fillDecision();
});
document.addEventListener('focusin', e => { if (isNoteTA(e.target)) lastNoteTA = e.target.id; if (isActTA(e.target)) lastActTA = e.target.id; });
document.addEventListener('input', e => {
  if (isNoteTA(e.target)){ noteEditing = true; editSecs.add(e.target.dataset.sec); autoGrow(e.target); noteStatus('Unsaved changes'); clearTimeout(noteDraftTimer); noteDraftTimer = setTimeout(noteFlush, 120000); return; }
  if (isActTA(e.target)){ autoGrow(e.target); if (actEd && e.target.dataset.act === actEd.id) actEd.draft[e.target.dataset.asec] = e.target.value; actStatus('Unsaved changes'); clearTimeout(actDraftTimer); actDraftTimer = setTimeout(() => actFlush(), 120000); return; }
  if (e.target.classList && e.target.classList.contains('mdta')) autoGrow(e.target);
});
document.addEventListener('submit', e => {
  if (e.target.id === 'logform'){ e.preventDefault(); submitModal(); return; }
  if (e.target.id === 'addform'){ e.preventDefault(); submitAddForm(e.target); return; }
  if (e.target.id === 'gateform'){ e.preventDefault(); const f = e.target; if (f.password.value) unlock(f.password.value, f.remember.checked); return; }
  if (e.target.id === 'tokenform'){ e.preventDefault(); saveToken(e.target.token.value); return; }
  if (e.target.classList.contains('cmtform')){ e.preventDefault(); postComment(e.target); return; }
});
document.addEventListener('keydown', e => {
  if (e.target && e.target.closest && e.target.closest('.stedit') && !e.target.closest('.cmtform')){
    const box = e.target.closest('.stedit');
    if (((e.key === 's' || e.key === 'S') || e.key === 'Enter') && (e.metaKey || e.ctrlKey)){ e.preventDefault(); const b = box.querySelector('[data-primary]'); if (b) b.click(); return; }
    if (e.key === 'Enter' && e.target.tagName === 'INPUT' && !e.shiftKey){ e.preventDefault(); const b = box.querySelector('[data-primary]'); if (b) b.click(); return; }
  }
  if ((e.key === 's' || e.key === 'S') && (e.metaKey || e.ctrlKey) && isActTA(e.target)){ e.preventDefault(); clearTimeout(actDraftTimer); const ch = actFlush(); toast(ch ? 'Saved.' : 'Nothing new to save.'); return; }
  if ((e.key === 's' || e.key === 'S') && (e.metaKey || e.ctrlKey) && isNoteTA(e.target)){ e.preventDefault(); clearTimeout(noteDraftTimer); const changed = noteFlush(); toast(changed ? 'Note saved.' : 'Nothing new to save.'); return; }
  if ((e.key === 'Enter') && (e.metaKey || e.ctrlKey) && e.target && e.target.closest && e.target.closest('.cmtform')){ e.preventDefault(); postComment(e.target.closest('.cmtform')); return; }
  if (e.key === 'Escape'){
    if (closeLightbox()) return;
    if (modalOpen){ closeModal(); return; }
    if (drawerOpen){ drawerOpen = false; renderDrawer(); return; }
    if (logEditing){ logEditing = null; render(true); return; }
    if (removing && removing.kind === 'log'){ removing = null; render(true); return; }
    if (editingPart){ const r = refById(editingPart); editingPart = null; if (r) renderDeep(r.map); if (pendingRender) render(); return; }
    if (outlineEditing){ outlineEditing = null; render(); return; }
    if (view === 'artifacts'){
      for (const key of ['train','arch']){ const s = mst[key]; if (s.part){ closePart(key); return; } }
      for (const key of ['train','arch']){ const s = mst[key]; if (s.open){ s.open = null; s.part = null; s.psel = null; updateMap(key); renderPanel(key); return; } }
      if (ast.open){ ast.open = null; const h = document.getElementById('svg-artifacts'); if (h) h.innerHTML = artifactsSvg(); renderArtPanel(); applySelection(); return; }
      if (selected){ selected = null; applySelection(); }
      return;
    }
    if (view === 'logs'){ if (noteEditing){ const changed = noteExit(); if (!changed){ renderDayPanel(); if (pendingRender) render(); } return; } if (selected){ selected = null; applySelection(); } return; }
    if (view === 'plan'){
      if (removing){ removing = null; render(true); return; }
      if (addForm){ addForm = null; render(true); return; }
      if (importPending){ importPending = null; render(true); return; }
      if (stEdit){ stEdit = null; render(true); return; }
      if (actEd){ const ch = actExit(); render(true); toast(ch ? 'Saved.' : 'No changes.'); return; }
      if (pst.q){ pst.q = null; render(true); return; }
      if (pst.act){ actBack(); return; }
      if (pst.stage){ pst.stage = null; selected = null; render(true); return; }
      if (pst.vpart){ pst.vpart = null; selected = null; render(); return; }
      if (selected){ selected = null; applySelection(); }
    }
    return;
  }
  if (e.key === 'Enter' && !e.shiftKey && !e.metaKey && !e.ctrlKey && e.target && (isNoteTA(e.target) || e.target.id === 'logedit-text' || (e.target.classList && e.target.classList.contains('mdta')))){
    const t = e.target; const st0 = t.selectionStart; if (st0 !== t.selectionEnd) return;
    const before = t.value.slice(0, st0), after = t.value.slice(st0); const line = before.slice(before.lastIndexOf('\n') + 1);
    const m = line.match(/^(\s*)([-*+]|\d+[.)])(\s+)(\[( |x|X)\]\s*)?(.*)$/); if (!m) return;
    e.preventDefault();
    if (!m[6].trim() && !m[4]){ t.value = before.slice(0, before.length - line.length) + after; t.selectionStart = t.selectionEnd = st0 - line.length; return; }
    if (!m[6].trim() && m[4]){ t.value = before.slice(0, before.length - line.length) + after; t.selectionStart = t.selectionEnd = st0 - line.length; return; }
    const marker = /^\d/.test(m[2]) ? (parseInt(m[2], 10) + 1) + m[2].slice(-1) : m[2];
    const ins = '\n' + m[1] + marker + m[3] + (m[4] ? '[ ] ' : '');
    t.value = before + ins + after; t.selectionStart = t.selectionEnd = st0 + ins.length; return;
  }
  if (e.key === 'Tab' && e.target && (e.target.id === 'outlineedit' || isNoteTA(e.target) || e.target.id === 'logedit-text' || (e.target.classList && e.target.classList.contains('mdta')))){
    e.preventDefault(); const t = e.target; const st0 = t.selectionStart, en0 = t.selectionEnd;
    const before = t.value.slice(0, st0), after = t.value.slice(en0);
    const lineStart = before.lastIndexOf('\n') + 1;
    if (e.shiftKey){ const line = before.slice(lineStart); if (line.startsWith('  ')){ t.value = before.slice(0, lineStart) + line.slice(2) + after; t.selectionStart = t.selectionEnd = st0 - 2; } }
    else { t.value = before.slice(0, lineStart) + '  ' + before.slice(lineStart) + after; t.selectionStart = t.selectionEnd = st0 + 2; }
    return;
  }
  if (modalOpen || editingPart || noteEditing || outlineEditing || addForm || removing || logEditing || stEdit) return;
  if (e.target && e.target.closest && e.target.closest('textarea, input')) return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.matches && e.target.matches('[role="button"]') && !e.target.matches('button')){
    e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', {bubbles:true}));
  }
});

boot();
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMK Routebook</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
  svg: { fontCache: 'global' },
  options: { enableMenu: false },
  startup: { typeset: false, ready(){ MathJax.startup.defaultReady(); MathJax.startup.promise.then(() => { window.__mjReady = true; if (window.__typesetAll) window.__typesetAll(); }); } }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" async></script>
<style>
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#ECEDF3; --surface-3:#E3E5EE;
  --ink:#1B1D2A; --ink-2:#4E5368; --ink-3:#7F8499;
  --line:#D8DBE6; --line-2:#E9EBF1;
  --accent:#3E3C9B; --accent-ink:#2F2D7C; --accent-soft:#E9E8F8; --accent-line:#B9B7E6; --on-accent:#FFFFFF;
  --ok:#2B7F55; --ok-soft:#DDF0E5;
  --warn:#A8651A; --warn-soft:#F8EAD3;
  --bad:#B7412F; --bad-soft:#F8E0DB;
  --run:#1D7C86; --run-soft:#D8EDF0;
  --det:#1F5FA8; --det-soft:#E5EEF9; --det-line:#8FB2E0;
  --lrn:#BF3E2C; --lrn-soft:#FBE7E2; --lrn-line:#E4A093;
  --io:#5B6472; --io-soft:#EEF0F4;
  --shadow:0 1px 2px rgba(27,29,42,.05), 0 6px 20px rgba(27,29,42,.07);
  --display:'Newsreader', 'Iowan Old Style', Georgia, serif;
  --body:'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  --mono:'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13141B; --surface:#1B1D27; --surface-2:#232633; --surface-3:#2B2F3E;
    --ink:#E7E8F0; --ink-2:#ABAFC2; --ink-3:#7E8399;
    --line:#2F3345; --line-2:#262A38;
    --accent:#A5A3F3; --accent-ink:#C4C2FA; --accent-soft:#272948; --accent-line:#4C4A9C; --on-accent:#14142B;
    --ok:#62C08E; --ok-soft:#1B3628;
    --warn:#E2A455; --warn-soft:#3B2D16;
    --bad:#E8735F; --bad-soft:#40201A;
    --run:#5FC0CA; --run-soft:#163236;
    --det:#7CB0EE; --det-soft:#1B2A40; --det-line:#3D6598;
    --lrn:#F08A73; --lrn-soft:#3C201B; --lrn-line:#8E4A3C;
    --io:#AEB4C0; --io-soft:#232633;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#13141B; --surface:#1B1D27; --surface-2:#232633; --surface-3:#2B2F3E;
  --ink:#E7E8F0; --ink-2:#ABAFC2; --ink-3:#7E8399;
  --line:#2F3345; --line-2:#262A38;
  --accent:#A5A3F3; --accent-ink:#C4C2FA; --accent-soft:#272948; --accent-line:#4C4A9C; --on-accent:#14142B;
  --ok:#62C08E; --ok-soft:#1B3628;
  --warn:#E2A455; --warn-soft:#3B2D16;
  --bad:#E8735F; --bad-soft:#40201A;
  --run:#5FC0CA; --run-soft:#163236;
  --det:#7CB0EE; --det-soft:#1B2A40; --det-line:#3D6598;
  --lrn:#F08A73; --lrn-soft:#3C201B; --lrn-line:#8E4A3C;
  --io:#AEB4C0; --io-soft:#232633;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg g[tabindex]:focus{outline:none}
select,textarea,input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
textarea{resize:vertical;min-height:84px;line-height:1.4}
[hidden]{display:none!important}
.nid{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--accent);white-space:nowrap}
.mono{font-family:var(--mono);font-size:12px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
kbd{font-family:var(--body);font-size:12px;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--surface);color:var(--ink-2)}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;align-items:center;gap:20px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.top .titleblock{min-width:0;flex:1 1 auto}
.top .eyebrow{margin-bottom:1px}
.top h1{font-family:var(--display);font-size:24px;font-weight:500;line-height:1.15;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex:0 0 auto}
.tabs button{padding:6px 14px;border-radius:6px;font-weight:500;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:7px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{padding:5px 10px;font-size:13px;font-weight:500}
.btn.ghost{border-color:transparent;color:var(--accent);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}

.main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.foot{display:flex;align-items:center;gap:14px;padding:8px 20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);background:var(--surface)}
.foot .spacer{flex:1}

/* ---------- status pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em;line-height:18px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.pill.done,.pill.resolved,.pill.released,.pill.built,.pill.living{background:var(--ok-soft);color:var(--ok)}
.pill.active,.pill.running{background:var(--run-soft);color:var(--run)}
.pill.blocked{background:var(--bad-soft);color:var(--bad)}
.pill.reshaped,.pill.draft,.pill.outline{background:var(--warn-soft);color:var(--warn)}
.pill.open{background:var(--accent-soft);color:var(--accent)}
.pill.planned,.pill.parked,.pill.not-started{background:var(--surface-2);color:var(--ink-3)}
.pill.parked::before{opacity:.35}
.kind{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.kind.result{background:var(--run-soft);color:var(--run)}
.kind.decision{background:var(--warn-soft);color:var(--warn)}
.kind.note{background:var(--surface-2);color:var(--ink-2)}
.stale{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600;background:var(--bad-soft);color:var(--bad)}
.stale::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.layer{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 6px;border-radius:4px;line-height:17px}
.layer.det{color:var(--det);background:var(--det-soft)} .layer.lrn{color:var(--lrn);background:var(--lrn-soft)} .layer.mix{color:var(--ink-2);background:var(--surface-2)} .layer.io{color:var(--io);background:var(--io-soft)}

/* ---------- chips (edges) ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;padding:0 6px;border-radius:4px;font-family:var(--mono);font-size:11.5px;font-weight:500;line-height:18px;color:var(--accent);background:var(--accent-soft);border:1px solid transparent;cursor:pointer;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.ref{color:var(--det);background:var(--det-soft)}
.chip.ref.lrn{color:var(--lrn);background:var(--lrn-soft)}
.chip.logc{color:var(--ink-2);background:var(--surface-2)}
.chip:hover{border-color:var(--accent-line)}
.chip.hi{border-color:var(--accent)}
.verb{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.edgeline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:5px;font-size:12.5px;color:var(--ink-3)}

/* ---------- route tab ---------- */
.plantab{flex:1 1 auto;min-height:0;overflow:auto;padding:16px 20px 40px}
.sec{margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sechead{display:flex;align-items:baseline;gap:10px;padding:12px 18px;cursor:pointer;user-select:none}
.sechead .chev{font-size:13px;color:var(--ink-3);width:12px}
.sechead h2{font-family:var(--display);font-size:22px;font-weight:500}
.sechead .secsub{font-size:13px;color:var(--ink-3)}
.secbody{padding:2px 18px 18px}
.thesis{font-family:var(--display);font-size:17.5px;line-height:1.45;max-width:66ch;margin:2px 0 12px;color:var(--ink)}
.mapscroll.tight svg{min-width:640px;margin:0 auto}
.secbody .deep{margin:14px 0 0}
.secbody .panel{margin:14px 0 0;max-width:none}
.actgroups{display:grid;gap:14px}
.actgroup h4{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.actgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.actcard{padding:9px 11px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);cursor:pointer;display:grid;gap:3px}
.actcard.st-running{border-color:var(--run);background:var(--run-soft)}
.actcard.st-done{border-color:var(--ok);background:var(--ok-soft)}
.actcard.st-parked{border-style:dashed}
.actcard.open,.actcard.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.actcard.lit{border-color:var(--accent)}
.actcard .ac-head{display:flex;justify-content:space-between;align-items:baseline}
.actcard .ac-name{font-weight:600;font-size:14px;line-height:1.3}
.actcard .edgeline{margin-top:2px}
.deep .dline{font-size:15px;color:var(--ink-2);margin-top:6px}
svg .box.add rect{fill:var(--surface);stroke:var(--line);stroke-dasharray:4 3}
svg .box.add:hover rect{stroke:var(--ink)}
svg .box.add .plus{font-size:22px;fill:var(--ink-3)}
.addform{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;gap:10px;max-width:720px}
.addform h4{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.addform .tools{display:flex;gap:8px}
.addform .checks{display:grid;gap:6px}
.status-sel{width:auto;font-size:13px;padding:3px 8px;border-radius:999px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.panel .foot .tools-inline{display:inline-flex;gap:8px;align-items:center}
.panel .foot .tools-inline .btn{padding:3px 9px;font-size:12.5px}
.panel .inside{padding:0 26px 12px}
.panel .inside.top{padding:6px 26px 0}
.secbody .panel .deep{margin:14px 26px 0}
.panel .mini svg{margin:0 auto}
.iconbtn{font-size:16px;color:var(--ink-3);padding:0 4px;vertical-align:middle}
.iconbtn:hover{color:var(--ink)}
.hatp{position:relative;display:inline-block;font-style:italic;padding-right:.05em}
.hatp i{position:absolute;left:.22em;top:-.6em;font-size:.85em;font-style:normal}
.panel h2 .src{font-size:13px;font-family:var(--body)}
.deep .mini{margin:10px 0 0}
.deep .actgrid{margin-top:10px}
.deep > .tools{margin-top:12px}
.ol{list-style:disc;padding-left:22px;display:grid;gap:4px;font-size:15px;line-height:1.45}
.ol .ol{margin-top:4px;list-style:circle;font-size:14.5px;color:var(--ink-2)}
.ol .ol .ol{list-style:square}
.obox .tools{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--ink-3)}
textarea.outline{font-family:var(--mono);font-size:13px;line-height:1.5;min-height:150px;white-space:pre;tab-size:2}
.deep .obox{margin-top:8px}
.fields{display:grid;gap:10px;padding:8px 26px 4px}
.field-row{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:baseline}
.field-row h4{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
.field-row .ol{font-size:14.5px}
.lede .ol{font-family:var(--display);font-size:16px;color:var(--ink-2)}
@media (max-width:640px){ .field-row{grid-template-columns:1fr} .fields{padding:8px 16px 4px} }
.routemain{max-width:1160px;margin:0 auto}
.routemain.narrow{max-width:820px}
.calhead{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.calhead h3{font-family:var(--display);font-size:22px;font-weight:500;min-width:190px}
.calhead .faint{margin-left:auto;font-size:12.5px}
.cal{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px}
.cal .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 0 6px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:center}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{position:relative;min-height:84px;padding:6px 8px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:border-color .12s ease}
.day.blank{background:transparent;border-color:transparent;cursor:default}
.day:hover{border-color:var(--ink-3)}
.day .dn{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.day.today .dn{color:var(--on-accent);background:var(--accent);border-radius:999px;padding:0 6px;display:inline-block;width:max-content}
.day.has-note{background:var(--accent-soft);border-color:var(--accent-line)}
.day.future{opacity:.7}
.day .ex{font-size:12.5px;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.day .dots{display:flex;gap:3px;margin-top:auto}
.day .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.day .dot.result{background:var(--run)} .day .dot.decision{background:var(--warn)} .day .dot.note{background:var(--ink-3)}
.day.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.daynote{padding:6px 26px 0}
.daynote textarea{min-height:160px;font-size:15px;line-height:1.5}
.notebody{font-family:var(--display);font-size:16.5px;line-height:1.5;max-width:66ch}
.notebody .md{font-size:16.5px}
.notebody .md > * + *{margin-top:9px}
.md{font-size:14.5px;line-height:1.5}
.md > * + *{margin-top:6px}
.md p{margin:0}
.md h1,.md h2,.md h3{font-family:var(--display);font-weight:600;line-height:1.25}
.md > h1:not(:first-child),.md > h2:not(:first-child),.md > h3:not(:first-child){margin-top:12px}
.md h1{font-size:1.3em} .md h2{font-size:1.15em} .md h3{font-size:1.05em}
.md ul{list-style:disc;padding-left:22px;display:grid;gap:2px}
.md ol{list-style:decimal;padding-left:26px;display:grid;gap:2px}
.md li > ul,.md li > ol{margin-top:2px}
.md li.task{list-style:none;margin-left:-20px}
.md li.task label{display:inline-flex;gap:7px;align-items:baseline;cursor:pointer}
.md li.task input{width:auto;margin:0;vertical-align:-1px}
.md li.task input:checked + span{color:var(--ink-3);text-decoration:line-through}
.md code{font-family:var(--mono);font-size:.85em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.md pre{font-family:var(--mono);font-size:.85em;background:var(--surface-2);padding:8px 10px;border-radius:8px;overflow-x:auto;white-space:pre}
.md pre code{background:none;padding:0}
.md blockquote{border-left:3px solid var(--line);padding-left:10px;color:var(--ink-2)}
.md hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.md a{color:var(--accent)}
.md b{font-weight:600}
.daynote .tools code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:0 4px;border-radius:3px}
.daynote .tools{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12.5px}
.filters{display:flex;gap:6px;margin-bottom:10px}
.fbtn{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2)}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fbtn .n{font-family:var(--mono);font-size:11px;opacity:.75}
.log.wide{margin-top:8px}
.panel.wide{max-width:none}
.panel .bp{padding:0 0 8px}
.panel .bp .modelin{padding:0 26px}
.panel .bp .lede{margin-top:14px}
.caption .edges{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.caption .grp{display:inline-flex;align-items:center;gap:5px}
.col{display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.colhead{display:flex;align-items:baseline;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2);background:var(--surface)}
.colhead h2{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.colhead .hint{color:var(--ink-3);font-style:italic;font-family:var(--display);font-size:14px}
.colhead .count{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.colbody{overflow:auto;padding:12px 14px 20px;min-height:0;flex:1 1 auto}
@media (min-width:1000px){ .app{height:100vh;min-height:0} .main{overflow:hidden} }
@media (max-width:999px){ .top{flex-wrap:wrap;gap:10px 16px} .top h1{white-space:normal} }

/* selection: nodes light up, the rest recedes */
.node{transition:opacity .15s ease, box-shadow .15s ease, background .15s ease}
.has-sel .log .entry:not(.lit):not(.sel):not(:has(.hi)){opacity:.5}
.has-sel svg .box:not(.lit):not(.sel):not(.open){opacity:.5}
.entry.lit{box-shadow:inset 0 0 0 1.5px var(--accent-line)}
.entry.sel{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
svg .box.lit rect{stroke:var(--accent);stroke-width:2.5}
svg .box.sel rect{stroke:var(--ink);stroke-width:2.5}
.node[data-id]{cursor:pointer}
@media (prefers-reduced-motion: reduce){ .node{transition:none} html{scroll-behavior:auto} }

/* stage / unknown / activity boxes on the route maps */
svg .box .t2{font-size:13px;font-weight:600;fill:var(--ink)}
svg .box.stage rect{fill:var(--surface-2);stroke:var(--line)}
svg .box.stage.st-done rect{fill:var(--ok-soft);stroke:var(--ok)}
svg .box.stage.st-active rect{fill:var(--run-soft);stroke:var(--run)}
svg .box.stage.st-blocked rect{fill:var(--bad-soft);stroke:var(--bad)}
svg .box.unk rect{fill:var(--accent-soft);stroke:var(--accent-line)}
svg .box.unk.st-resolved rect{fill:var(--ok-soft);stroke:var(--ok)}
svg .box.unk.st-reshaped rect{fill:var(--warn-soft);stroke:var(--warn)}
svg .box.act rect{fill:var(--surface-2);stroke:var(--line)}
svg .box.act.st-running rect{fill:var(--run-soft);stroke:var(--run)}

(function(){

// ---------- state ----------

try { const v = localStorage.getItem('rb.view'); if (['plan','artifacts','logs'].includes(v)) view = v; } catch(e){}

// ---------- helpers ----------
const $ = (s, r) => (r||document).querySelector(s);

const find = (arr, id) => (arr||[]).find(x => x.id === id);

function fmt(d, year){ if(!d) return ''; const [y,m,dd] = d.split('-').map(Number); return MONTHS[m-1] + ' ' + dd + (year ? ', ' + y : ''); }
function daysAgo(n){ const t = new Date(TODAY + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() - n); return t.toISOString().slice(0,10); }

// ---------- a small Markdown renderer for notes, log entries and comments ----------
// Supports: paragraphs (single newlines break lines), # ## ### headings, - * + bullets, 1. numbered,
// nesting by indentation (2 spaces or a tab), - [ ] / - [x] tasks, **bold**, *italic*, `code`, ``` fences,
// > quotes, --- rules, [text](http…) links, ~~strike~~. TeX in \( \) and \[ \] is left for MathJax.
function mdInline(s){
  const parts = String(s).split(/(`[^`\n]*`)/);
  return parts.map((p, k) => {
    if (k % 2 === 1) return '<code>' + esc(p.slice(1, -1)) + '</code>';
    let t = esc(p);
    t = t.replace(/\[([^\]\n]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    t = t.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/__([^_\n]+)__/g, '<b>$1</b>');
    t = t.replace(/(^|[^*\w\\])\*([^*\n]+)\*(?![*\w])/g, '$1<i>$2</i>').replace(/(^|[^_\w\\])_([^_\n]+)_(?![_\w])/g, '$1<i>$2</i>');
    t = t.replace(/~~([^~\n]+)~~/g, '<s>$1</s>');
    return t;
  }).join('');
}
function md(src, ref){
  const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
  const out = []; let i = 0, taskN = 0;
  const LI = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const indentOf = ws => ws.replace(/\t/g, '  ').length;
  const item = text => {
    const m = text.match(/^\[( |x|X)\]\s*(.*)$/);
    if (m){ const n = taskN++; return `<li class="task"><label><input type="checkbox" ${m[1] !== ' ' ? 'checked' : ''} data-task="${n}" ${ref ? '' : 'disabled'}> <span>${mdInline(m[2])}</span></label></li>`; }
    return '<li>' + mdInline(text) + '</li>';
  };
  function list(baseIndent){
    // parses list items at indentation >= baseIndent until a non-list line; returns html
    let html = ''; let type = null; let open = 0; let lastIndent = baseIndent; let pendingClose = '';
    const stack = []; // [{indent, type}]
    const closeTo = n => { while (stack.length > n){ const s = stack.pop(); html += '</li></' + s.type + '>'; } };
    while (i < lines.length){
      const m = lines[i].match(LI);
      if (!m){
        // continuation line: indented text belongs to the previous item
        if (stack.length && lines[i].trim() && indentOf(lines[i].match(/^\s*/)[0]) > stack[stack.length - 1].indent){ html = html.replace(/<\/li>$/, '') ; html += '<br>' + mdInline(lines[i].trim()) + '</li>'; i++; continue; }
        break;
      }
      const ind = indentOf(m[1]); const t = /^\d/.test(m[2]) ? 'ol' : 'ul';
      if (!stack.length){ if (ind < baseIndent) break; stack.push({indent: ind, type: t}); html += '<' + t + '>' + item(m[3]); i++; continue; }
      const top = stack[stack.length - 1];
      if (ind > top.indent){ stack.push({indent: ind, type: t}); html = html.replace(/<\/li>$/, ''); html += '<' + t + '>' + item(m[3]); i++; continue; }
      while (stack.length > 1 && ind < stack[stack.length - 1].indent) { const s = stack.pop(); html += '</' + s.type + '></li>'; }
      const cur = stack[stack.length - 1];
      if (t !== cur.type){ html += '</' + cur.type + '>'; cur.type = t; html += '<' + t + '>' + item(m[3]); i++; continue; }
      html += item(m[3]); i++;
    }
    while (stack.length){ const s = stack.pop(); html += '</' + s.type + '>' + (stack.length ? '</li>' : ''); }
    return html;
  }
  while (i < lines.length){
    const L = lines[i];
    if (!L.trim()){ i++; continue; }
    if (/^```/.test(L)){ const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue; }
    let m;
    if ((m = L.match(/^(#{1,3})\s+(.*)$/))){ out.push(`<h${m[1].length}>${mdInline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(L)){ out.push('<hr>'); i++; continue; }
    if (/^>\s?/.test(L)){ const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, '')); out.push('<blockquote>' + md(buf.join('\n')) + '</blockquote>'); continue; }
    if (LI.test(L)){ out.push(list(0)); continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !LI.test(lines[i]) && !/^(#{1,3}\s|```|>\s?|\s*(-{3,}|\*{3,})\s*$)/.test(lines[i])) buf.push(lines[i++]);
    out.push('<p>' + buf.map(x => mdInline(x.trim())).join('<br>') + '</p>');
  }
  return `<div class="md"${ref ? ` data-src="${esc(ref)}"` : ''}>${out.join('')}</div>`;
}
// plain first line of a markdown text, for previews
function mdPlain(src){

}
// flip the n-th task checkbox in a markdown source

  let k = -1;
  return String(src).split('\n').map(line => { const m = line.match(/^(\s*([-*+]|\d+[.)])\s+)\[( |x|X)\](.*)$/); if (!m) return line; k++; return k === n ? m[1] + '[' + (checked ? 'x' : ' ') + ']' + m[4] : line; }).join('\n');

// ---------- the model tree, flattened into reference entries ----------
function buildRefs(){
  const out = [];
  if (!state || !state.model) return out;
  for (const key of ['arch','train']){
    const m = state.model[key]; if (!m) continue;
    for (const n of m.nodes){
      if (!n.parts) continue;
      out.push({id:n.id, path:n.id + '/', kind:'box', box:n.id, name:n.name, d:n.short, updated:n.updated, layer:n.layer, map:key, node:n});
      for (const p of (n.parts||[])) out.push({id:n.id + '/' + p.id, path:n.id + '/' + p.id, kind:'part', box:n.id, part:p.id, name:p.name, d:p.d, updated:p.updated, layer:p.cls||n.layer, map:key, node:n, partObj:p, hasBody:!!p.body});
    }
  }
  return out;
}
const refById = id => REFS.find(r => r.id === id);
function refUpdated(id){
  const r = refById(id); if (!r) return '';
  if (r.kind === 'part') return r.updated || '';
  let u = r.updated || '';
  for (const p of (r.node.parts||[])) if ((p.updated||'') > u) u = p.updated;
  return u;
}
function boxRefIds(boxId){ return REFS.filter(r => r.box === boxId).map(r => r.id); }

function node(id){
  if (!state) return null;
  if (id === 'vision') return {kind:'vision', id:'vision', name:'Vision'};
  const table = [['stage', state.stages], ['unknown', state.unknowns], ['activity', state.activities], ['artifact', state.artifacts]];
  for (const [kind, arr] of table){ const n = find(arr, id); if (n) return Object.assign({kind}, n); }
  const r = refById(id); if (r) return Object.assign({kind:'ref'}, r);
  const l = find(state.log, id); if (l) return Object.assign({}, l, {kind:'log', logKind:l.kind});
  return null;
}
function nameOf(n){
  switch(n.kind){
    case 'stage': return n.name;
    case 'unknown': return n.text;
    case 'activity': return n.name;
    case 'ref': return n.path;
    case 'artifact': return n.name;
    case 'log': return fmt(n.date) + ' ' + n.logKind;
    default: return n.name || n.id;
  }
}
function isStale(l){
  if (l.kind !== 'result' || !l.reportsOn) return null;
  const a = find(state.activities, l.reportsOn); if (!a) return null;
  const changed = (a.uses||[]).map(id => refById(id)).filter(r => r && refUpdated(r.id) > l.date);
  return changed.length ? changed : null;
}
const sortedLog = () => state.log.slice().sort((a,b) => (b.date + String(b.id).padStart(6,'0')).localeCompare(a.date + String(a.id).padStart(6,'0')));
function usersOf(refId){
  const r = refById(refId); if (!r) return [];
  const ids = r.kind === 'box' ? boxRefIds(refId) : [refId];
  return state.activities.filter(a => (a.uses||[]).some(u => ids.includes(u)));
}

// typed edges of a node
function edgesOf(id){
  const n = node(id); if (!n) return [];
  const E = [];
  const add = (verb, ids) => { ids = ids.filter(Boolean); if (ids.length) E.push({verb, ids}); };
  switch(n.kind){
    case 'vision':
      add('revised by', state.log.filter(l => l.kind === 'decision' && l.revises === 'vision').map(l => l.id));
      add('noted in', state.log.filter(l => l.kind === 'note' && l.about === 'vision').map(l => l.id));
      break;
    case 'stage':
      add('unknowns', state.unknowns.filter(u => u.stage === id).map(u => u.id));
      add('activities', state.activities.filter(a => a.stage === id).map(a => a.id));
      add('exit artifact', state.artifacts.filter(f => f.producedBy === id).map(f => f.id));
      add('revised by', state.log.filter(l => l.kind === 'decision' && l.revises === id).map(l => l.id));
      add('noted in', state.log.filter(l => l.kind === 'note' && l.about === id).map(l => l.id));
      break;
    case 'unknown':
      add('in stage', [n.stage]);
      add('targeted by', state.activities.filter(a => a.targets === id).map(a => a.id));
      add('moved by', state.log.filter(l => l.kind === 'result' && l.effect && l.effect.unknown === id).map(l => l.id));
      break;
    case 'activity':
      add('targets', [n.targets]);
      add('uses', n.uses || []);
      add('in stage', [n.stage]);
      add('reported on by', state.log.filter(l => l.kind === 'result' && l.reportsOn === id).map(l => l.id));
      break;
    case 'ref': {
      if (n.kind === 'ref' && n.partObj) add('in box', [n.box]); else add('parts', boxRefIds(id).filter(x => x !== id));
      const users = usersOf(id);
      add('used by', users.map(a => a.id));
      add('results that depend on it', state.log.filter(l => l.kind === 'result' && users.some(a => a.id === l.reportsOn)).map(l => l.id));
      add('noted in', state.log.filter(l => l.kind === 'note' && l.about === id).map(l => l.id));
      break; }
    case 'artifact':
      add('produced by', [n.producedBy]);
      break;
    case 'log':
      if (n.reportsOn) add('reports on', [n.reportsOn]);
      if (n.effect && n.effect.unknown) add(n.effect.outcome === 'reshaped' ? 'reshapes' : n.effect.outcome === 'resolved' ? 'resolves' : 'leaves open', [n.effect.unknown]);
      if (n.revises) add('revises', [n.revises]);
      if (n.about) add('about', [n.about]);
      break;
  }
  return E;
}
function neighbors(id){ const set = new Set([id]); for (const e of edgesOf(id)) for (const x of e.ids) set.add(x); return set; }

function parseOutline(text){
  const root = {children: []}; const stack = [{depth: -1, node: root}];
  for (const raw of String(text).split('\n')){
    if (!raw.trim()) continue;
    const m = raw.match(/^(\s*)[-*•]?\s*(.*)$/); const depth = Math.floor(m[1].replace(/\t/g, '  ').length / 2); const node = {text: m[2].trim()};
    while (stack.length && stack[stack.length - 1].depth >= depth) stack.pop();

}

// a row of boxes, wrapping into rows when there are many
function boxRowSvg(items, opts){

      <rect x="${x}" y="${y}" width="${W}" height="${H}" rx="${pill ? H/2 : 9}"></rect>
      ${it.n ? `<text class="n" x="${x + (pill ? 16 : 9)}" y="${y + 14}">${esc(it.n)}</text>` : ''}
      <text class="t2" text-anchor="middle">${tspans(lines, x + W/2, lines.length > 1 ? y + (it.sub ? 22 : 26) : y + (it.sub ? 29 : 35), 15)}</text>
      ${it.sub ? `<text class="s" x="${x + W/2}" y="${y + H - 8}" text-anchor="middle">${esc(it.sub)}</text>` : ''}${cbadgeSvg(it.target || it.id, x + W - 12, y + 12)}

}

    if (a === 'outline-save'){
      const t = $('#outlineedit'); const tgt = outlineTarget(act.dataset.kind, act.dataset.id);
      if (t && tgt){ tgt[0][tgt[1]] = parseOutline(t.value); }
      outlineEditing = null; commit(); return;
    }
    if (a === 'close-stage'){ pst.stage = null; pst.cat = null; pst.part = null; selected = null; outlineEditing = null; addForm = null; render(); return; }
    if (a === 'close-part-route'){ pst.part = null; selected = pst.stage; outlineEditing = null; render(); return; }
    if (a === 'close-act'){ pst.act = null; selected = null; outlineEditing = null; addForm = null; render(); return; }
    if (a === 'open-day'){ openDay(act.dataset.day, true); return; }
    if (a === 'close-day'){ cal.open = null; noteEditing = false; document.querySelectorAll('.day.sel').forEach(x => x.classList.remove('sel')); renderDayPanel(); if (pendingRender) render(); return; }
    if (a === 'note-edit'){ noteEditing = true; renderDayPanel(); const t = $('#noteedit'); if (t) t.focus(); return; }
    if (a === 'note-cancel'){ noteEditing = false; renderDayPanel(); if (pendingRender) render(); return; }
    if (a === 'note-save'){ const t = $('#noteedit'); const d = act.dataset.day; if (t && d){ const txt = t.value.trim(); const notes = notesOf(); notes[d] = txt ? {text: txt, updated: TODAY, stamp: stampNow()} : {text: '', updated: TODAY, stamp: stampNow(), deleted: true}; } noteEditing = false; commit(); toast('Note saved.'); return; }
    if (a === 'toggle-drawer'){ drawerOpen = !drawerOpen; renderDrawer(); return; }
    if (a === 'close-drawer'){ drawerOpen = false; renderDrawer(); return; }
    if (a === 'goto-target'){ gotoTarget(act.dataset.target); return; }
    if (a === 'cmt-resolve'){ const c = findComment(act.dataset.target, act.dataset.cid); if (c){ c.resolved = !c.resolved; c.updated = nowIso(); commit(); refreshCmts(act.dataset.target); } return; }
    if (a === 'cmt-delete'){ const c = findComment(act.dataset.target, act.dataset.cid); if (c){ c.deleted = true; c.updated = nowIso(); commit(); refreshCmts(act.dataset.target); toast('Comment deleted.'); } return; }
    if (a === 'cmt-showres'){ const t = act.dataset.target; if (resolvedShown.has(t)) resolvedShown.delete(t); else resolvedShown.add(t); refreshCmts(t); return; }
    if (a === 'cmt-name'){ try { localStorage.removeItem('rb.name'); } catch(e){} const f = act.closest('.cmts'); if (f) refreshCmts(f.dataset.target); return; }
    if (a === 'retry-save'){ doSave(); return; }
    if (a === 'refresh'){ refreshFromRepo(true); return; }
    if (a === 'lock'){ lock(); return; }
    if (a === 'change-token'){ tokenError = ''; dbState = 'needtoken'; render(); return; }
    if (a === 'token-cancel'){ tokenError = ''; dbState = 'ready'; render(); return; }
    return;
  }
  if (e.target.closest('#back') && !e.target.closest('.modal')){ closeModal(); return; }
  if (e.target.closest('textarea, input, select')) return;
  // chips go where they point, in every tab
  const c = e.target.closest('.chip[data-id]');
  if (c){ const id = c.dataset.id; if (refById(id)) openModelAt(id); else gotoNode(id); return; }
  if (view === 'artifacts'){
    const gp = e.target.closest('svg .box[data-part]'); if (gp){ openPart(mapKeyOf(gp), gp.dataset.part); return; }
    const g = e.target.closest('svg .box[data-box]'); if (g){ openBox(mapKeyOf(g), g.dataset.box, true); return; }
    const fa = e.target.closest('#svg-artifacts .box'); if (fa){ openArtifact(fa.dataset.id, true); return; }
    const en = e.target.closest('.entry[data-id]'); if (en){ selected = (selected === en.dataset.id) ? null : en.dataset.id; applySelection(); return; }
    return;
  }
  if (view === 'logs'){
    const en = e.target.closest('.entry[data-id]'); if (en){ selected = (selected === en.dataset.id) ? null : en.dataset.id; applySelection(); return; }
    const dy = e.target.closest('.day[data-day]'); if (dy){ openDay(dy.dataset.day, true); return; }
    return;
  }
  if (view === 'plan'){
    const n = e.target.closest('[data-id]'); if (!n) return;
    const id = n.dataset.id;
    if (n.closest('#svg-vision')) togglePlan('vpart', id);
    else if (n.closest('#svg-route')) togglePlan('stage', id);
    else if (n.closest('#svg-cats')) togglePlan('cat', id);
    else if (n.dataset.in === 'stage') togglePlan('goact', id);
    else if (n.closest('#mini-route')) togglePlan('part', id);
    else if (n.classList.contains('actcard')) togglePlan('act', id);
    else if (n.classList.contains('entry')){ selected = (selected === id) ? null : id; applySelection(); }
  }
});
document.addEventListener('change', e => {
  if (e.target.matches && e.target.matches('.md input[data-task]')){
    const box = e.target.closest('.md[data-src]'); if (!box) return;
    const src = box.dataset.src; const n = Number(e.target.dataset.task); const on = e.target.checked;
    if (src.startsWith('note:')){ const nt = notesOf()[src.slice(5)]; if (nt && nt.text){ nt.text = mdToggleTask(nt.text, n, on); nt.updated = TODAY; nt.stamp = stampNow(); } }
    else if (src.startsWith('log:')){ const l = find(state.log, src.slice(4)); if (l){ l.text = mdToggleTask(l.text, n, on); l.updated = stampNow(); } }
    else if (src.startsWith('cmt:') && typeof findComment === 'function'){ const rest = src.slice(4); const k = rest.indexOf(':'); const c = findComment(rest.slice(k + 1), rest.slice(0, k)); if (c){ c.text = mdToggleTask(c.text, n, on); c.updated = stampNow(); } }
    commit(); return;
  }
  if (e.target.classList && e.target.classList.contains('status-sel')){
    const kind = e.target.dataset.kind, id = e.target.dataset.id, v = e.target.value;
    const t = kind === 'stage' ? find(state.stages, id) : find(state.activities, id);
    if (t){ t.status = v; commit(); }
    return;
  }
  const f = e.target.closest('#logform'); if (!f) return;
  if (e.target.name === 'kind'){ for (const k of ['result','decision','note']) $('#f-' + k).hidden = (k !== e.target.value); const t = $('#f-' + e.target.value + ' textarea'); if (t) t.focus(); }
  if (e.target.name === 'activity') fillPropagate();
  if (e.target.name === 'stage') fillDecision();
});
document.addEventListener('input', e => {
  if (e.target.name === 'newtext' && e.target.value.trim()){ const r = e.target.closest('#logform').querySelector('input[name=outcome][value=reshaped]'); if (r) r.checked = true; }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'logform'){ e.preventDefault(); submitModal(); return; }
  if (e.target.id === 'addform'){ e.preventDefault(); submitAddForm(e.target); return; }
  if (e.target.id === 'gateform'){ e.preventDefault(); const f = e.target; if (f.password.value) unlock(f.password.value, f.remember.checked); return; }
  if (e.target.id === 'tokenform'){ e.preventDefault(); saveToken(e.target.token.value); return; }
  if (e.target.classList.contains('cmtform')){ e.preventDefault(); postComment(e.target); return; }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter') && (e.metaKey || e.ctrlKey) && e.target && e.target.closest && e.target.closest('.cmtform')){ e.preventDefault(); postComment(e.target.closest('.cmtform')); return; }
  if (e.key === 'Escape'){
    if (modalOpen){ closeModal(); return; }
    if (drawerOpen){ drawerOpen = false; renderDrawer(); return; }
    if (logEditing){ logEditing = null; render(true); return; }
    if (removing && removing.kind === 'log'){ removing = null; render(true); return; }
    if (editingPart){ const r = refById(editingPart); editingPart = null; if (r) renderDeep(r.map); if (pendingRender) render(); return; }
    if (outlineEditing){ outlineEditing = null; render(); return; }
    if (view === 'artifacts'){
      for (const key of ['train','arch']){ const s = mst[key]; if (s.part){ closePart(key); return; } }
      for (const key of ['train','arch']){ const s = mst[key]; if (s.open){ s.open = null; s.part = null; s.psel = null; updateMap(key); renderPanel(key); return; } }
      if (ast.open){ ast.open = null; const h = document.getElementById('svg-artifacts'); if (h) h.innerHTML = artifactsSvg(); renderArtPanel(); applySelection(); return; }
      if (selected){ selected = null; applySelection(); }
      return;
    }
    if (view === 'logs'){ if (noteEditing){ noteEditing = false; renderDayPanel(); if (pendingRender) render(); return; } if (cal.open){ cal.open = null; document.querySelectorAll('.day.sel').forEach(x => x.classList.remove('sel')); renderDayPanel(); return; } if (selected){ selected = null; applySelection(); } return; }
    if (view === 'plan'){
      if (removing){ removing = null; render(true); return; }
      if (addForm){ addForm = null; render(true); return; }
      if (pst.part){ pst.part = null; selected = pst.stage; render(); return; }
      if (pst.cat){ pst.cat = null; selected = pst.stage; render(); return; }
      if (pst.act){ pst.act = null; selected = null; render(); return; }
      if (pst.stage){ pst.stage = null; selected = null; render(); return; }
      if (pst.vpart){ pst.vpart = null; selected = null; render(); return; }
      if (selected){ selected = null; applySelection(); }
    }
    return;
  }
  if (e.key === 'Enter' && !e.shiftKey && !e.metaKey && !e.ctrlKey && e.target && (e.target.id === 'noteedit' || e.target.id === 'logedit-text')){
    const t = e.target; const st0 = t.selectionStart; if (st0 !== t.selectionEnd) return;
    const before = t.value.slice(0, st0), after = t.value.slice(st0); const line = before.slice(before.lastIndexOf('\n') + 1);
    const m = line.match(/^(\s*)([-*+]|\d+[.)])(\s+)(\[( |x|X)\]\s*)?(.*)$/); if (!m) return;
    e.preventDefault();
    if (!m[6].trim() && !m[4]){ t.value = before.slice(0, before.length - line.length) + after; t.selectionStart = t.selectionEnd = st0 - line.length; return; }
    if (!m[6].trim() && m[4]){ t.value = before.slice(0, before.length - line.length) + after; t.selectionStart = t.selectionEnd = st0 - line.length; return; }
    const marker = /^\d/.test(m[2]) ? (parseInt(m[2], 10) + 1) + m[2].slice(-1) : m[2];
    const ins = '\n' + m[1] + marker + m[3] + (m[4] ? '[ ] ' : '');
    t.value = before + ins + after; t.selectionStart = t.selectionEnd = st0 + ins.length; return;
  }
  if (e.key === 'Tab' && e.target && (e.target.id === 'outlineedit' || e.target.id === 'noteedit' || e.target.id === 'logedit-text')){
    e.preventDefault(); const t = e.target; const st0 = t.selectionStart, en0 = t.selectionEnd;
    const before = t.value.slice(0, st0), after = t.value.slice(en0);
    const lineStart = before.lastIndexOf('\n') + 1;
    if (e.shiftKey){ const line = before.slice(lineStart); if (line.startsWith('  ')){ t.value = before.slice(0, lineStart) + line.slice(2) + after; t.selectionStart = t.selectionEnd = st0 - 2; } }
    else { t.value = before.slice(0, lineStart) + '  ' + before.slice(lineStart) + after; t.selectionStart = t.selectionEnd = st0 + 2; }
    return;
  }
  if (modalOpen || editingPart || noteEditing || outlineEditing || addForm || removing || logEditing) return;
  if (e.target && e.target.closest && e.target.closest('textarea, input')) return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.matches && e.target.matches('[role="button"]') && !e.target.matches('button')){
    e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', {bubbles:true}));
  }
});

boot();
})();
</script>

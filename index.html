<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CMK Vision</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M12%202.6%2020.2%207.3v9.4L12%2021.4%203.8%2016.7V7.3z%22%20fill%3D%22none%22%20stroke%3D%22%232A55A0%22%20stroke-width%3D%221.9%22%20stroke-linejoin%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%224.3%22%20fill%3D%22none%22%20stroke%3D%22%232A55A0%22%20stroke-width%3D%221.7%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400..700;1,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#ECEFEA; --surface:#fff; --surface-2:#F3F6F2; --ink:#1C2826; --ink-2:#465451; --ink-3:#6F7D79; --line:#D2DAD4; --line-2:#E3E9E4;
  --accent:#2A55A0; --accent-soft:#E9EFF9; --accent-line:#C3D2EC; --hl:#F4D65E; --hl-soft:#FBEFB8; --hl-line:#E3C651;
  --ok:#2E7A4D; --ok-soft:#E3F1E7; --ok-line:#9CCBAD; --bad:#AF3D2D; --bad-soft:#F8E3DE; --bad-line:#E2A598;
  --read:'Literata', Georgia, serif; --body:'Atkinson Hyperlegible Next', system-ui, sans-serif; --mono:'IBM Plex Mono', Menlo, monospace;
  --display:var(--read); --raised:#fff; --on-solid:#fff;
  --pattern:linear-gradient(rgba(52,104,84,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(52,104,84,.07) 1px,transparent 1px); --pattern-size:24px 24px; --pattern-repeat:repeat;
  --shadow:0 12px 32px -14px rgba(28,40,38,.2); --hl-ring:#c9a723; --hl-hover:#f7e6a0; --now-ink:#8a6a0a; --ok-hover:#d5eadb;
  --sum-hover:#EBF0EA; --accent-hover:#DCE6F6; --pdf-ink:#9b2c1f; --pdf-bg:#fbe9e6;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:var(--pattern);background-size:var(--pattern-size);background-repeat:var(--pattern-repeat)}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:18px;padding:10px 22px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--read);font-size:20px;font-weight:700;margin-right:auto;white-space:nowrap}
.brand svg{width:24px;height:24px;color:var(--accent)}
.nav{display:flex;gap:2px}
.nav a{padding:6px 12px;border-radius:8px;color:var(--ink-2);font-weight:600;text-decoration:none;font-size:14.5px}
.nav a:hover{background:var(--surface-2)}
.docbtn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font-weight:600;text-decoration:none;font-size:14px;white-space:nowrap}
main{max-width:1000px;margin:0 auto;padding:26px 18px 70px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.draft{font-size:12.5px;color:var(--ink-3);text-align:center;margin:-8px 0 -6px}

/* ---------- section cards ---------- */
section.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);scroll-margin-top:70px;min-width:0}
.shead{display:flex;align-items:baseline;gap:10px;padding:16px 24px;cursor:pointer;user-select:none}
.shead .schev{width:12px;font-size:12px;color:var(--ink-3);display:inline-block;transition:transform .15s}
section.shut .schev{transform:rotate(-90deg)}
.shead h2{margin:0;font-family:var(--read);font-size:22px;font-weight:650;letter-spacing:-.01em}
.shead .r{margin-left:auto;font-size:13px;color:var(--ink-3)}
.lnk{font-size:13px;font-weight:600;color:var(--accent);padding:2px 4px;border-radius:5px}
.lnk:hover{background:var(--accent-soft)}
.sbody{padding:0 24px 24px}
section.shut .sbody{display:none}
section.shut .shead .r{display:none}

/* ---------- vision: the accomplishment (claim only) ---------- */
.acc{position:relative;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:11px;padding:15px 20px 18px}
.eyebrow{display:block;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.claim{font-family:var(--read);font-size:21px;line-height:1.42;font-weight:500;max-width:58ch;margin:0}
.claim mark{background:linear-gradient(transparent 58%,var(--hl-soft) 58%);color:inherit;padding:0 1px}
.acc .edlink{position:absolute;top:13px;right:16px}

/* ---------- vision: motivation boxes ---------- */
.junc{position:relative;height:40px;display:flex;justify-content:center;align-items:flex-end;margin-bottom:-11px;z-index:1}
.junc::before{content:"";position:absolute;top:0;bottom:11px;left:50%;border-left:1.5px solid var(--line)}
.pill{position:relative;display:inline-block;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:2px 13px;line-height:16px;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.mgrid{--gap:12px;position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--gap);padding-top:17px}
.mgrid::before{content:"";position:absolute;top:0;left:calc((100% - 4 * var(--gap)) / 10);right:calc((100% - 4 * var(--gap)) / 10);border-top:1.5px solid var(--line)}
.mbox{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:74px;padding:10px 10px;text-align:center;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;transition:opacity .15s,border-color .15s,background .15s}
.mbox::before{content:"";position:absolute;top:-18px;left:50%;height:17px;border-left:1.5px solid var(--line)}
.mbox:hover{border-color:var(--ink-3)}
.mt{font-size:14.5px;font-weight:600;line-height:1.3;color:var(--ink)}
.ms{font-size:12px;color:var(--ink-3)}
.mbox.open{background:var(--raised);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mgrid.has-open .mbox:not(.open){opacity:.55}
.mgrid.has-open .mbox:not(.open):hover{opacity:.85}

.panel{grid-column:1 / -1;position:relative;margin-top:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:16px 22px 14px;scroll-margin-top:80px}
.panel::before{content:"";position:absolute;top:-8px;left:calc(var(--nx, 50%) - 7px);width:14px;height:14px;background:var(--surface-2);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.panel.flat::before{display:none}
.panel.flash{animation:flash 1s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--hl)}100%{box-shadow:0 0 0 3px transparent}}
.ph{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.ph h3{margin:0;font-family:var(--read);font-size:20px;font-weight:600}
.ph .close{margin-left:auto;font-size:12.5px;color:var(--ink-3);padding:2px 6px;border-radius:5px}
.ph .close:hover{color:var(--ink);background:var(--raised)}
.pfoot{display:flex;gap:8px;align-items:center;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:7px;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--raised);color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-solid)}
.hint{font-size:12px;color:var(--ink-3)}

.md{font-family:var(--read);font-size:16px;line-height:1.6;color:var(--ink);max-width:76ch}
.md p{margin:0 0 8px}
.md ul{margin:0 0 8px;padding-left:20px}
.md ul ul{margin:4px 0 0;color:var(--ink-2)}
.md li + li{margin-top:5px}
.md li::marker{color:var(--ink-3)}
.md h4{margin:14px 0 4px;font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.md h4:first-child{margin-top:0}
.md > :last-child{margin-bottom:0}
.md .empty{color:var(--ink-3);font-style:italic}
textarea{width:100%;font-family:var(--mono);font-size:13.5px;line-height:1.55;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical;tab-size:2}
textarea:focus{outline:2px solid var(--accent-line);border-color:var(--accent)}
textarea.claimed{font-family:var(--read);font-size:17px;min-height:84px}

/* ---------- roadmap: rows of boxes that open downward ---------- */
.lines{--g:12px;display:grid;gap:14px}
.line{display:grid;column-gap:var(--g);row-gap:12px;align-items:stretch}
.cell{position:relative;display:flex;flex-direction:column;min-width:0}
.cell > .rbox{flex:1 1 auto}
.arrow{position:absolute;top:50%;left:100%;width:var(--g);height:14px;margin-top:-7px;padding:0 7px;color:var(--ink-2)}
.arrow svg{display:block;width:100%;height:100%}
.arrow .v{display:none}
.rbox{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:68px;padding:12px 14px;text-align:center;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;transition:opacity .15s,border-color .15s}
.rbox:hover{border-color:var(--ink-3)}
.rbox.met{background:var(--ok-soft);border-color:var(--ok-line)}
.rbox.failed{background:var(--bad-soft);border-color:var(--bad-line)}
.rbox.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.lines.has-sel > .line > .cell > .rbox:not(.sel){opacity:.6}
.lines.has-sel > .line > .cell > .rbox:not(.sel):hover{opacity:.9}
.lines > .rpanel{margin-top:0}
.rt{font-size:14.5px;font-weight:600;line-height:1.3;color:var(--ink)}
.rsub{font-size:12px;color:var(--ink-3);margin-top:-3px}
.rnum{position:absolute;top:6px;left:9px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.mark{position:absolute;top:5px;right:8px;font-size:11px;font-weight:700}
.met .mark{color:var(--ok)} .failed .mark{color:var(--bad)}
.cur{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--hl);box-shadow:0 0 0 1.5px var(--hl-ring)}
.pips{display:flex;gap:4px}
.pips i{width:7px;height:7px;border-radius:50%;border:1.3px solid var(--ink-3)}
.pips i.met{background:var(--ok);border-color:var(--ok)}
.pips i.failed{background:var(--bad);border-color:var(--bad)}

.work h5{margin:0 0 4px;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.work + .lines{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.wact{margin:0 -10px;border-radius:8px}
.wact + .wact{margin-top:3px}
.wrow{display:grid;grid-template-columns:78px minmax(0,1fr) 14px;gap:12px;align-items:baseline;width:100%;padding:8px 10px;border-radius:8px;text-align:left;color:var(--ink)}
.wrow:hover{background:var(--line-2)}
.wst{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.wt{font-size:14.5px;line-height:1.4}
.wchev{font-size:10px;color:var(--ink-3);transition:transform .15s;text-align:center}
.wact.open .wchev{transform:rotate(90deg)}
/* done: a satisfying green; current (agreed at the latest weekly meeting): yellow */
.wact.done{background:var(--ok-soft)} .wact.done .wst{color:var(--ok)} .wact.done .wrow:hover{background:var(--ok-hover)}
.wact.now{background:var(--hl-soft)} .wact.now .wst{color:var(--now-ink)} .wact.now .wrow:hover{background:var(--hl-hover)}
.wact.flash{animation:flash 1.2s ease}
.wdet{padding:0 12px 12px 100px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.stp{flex:0 0 18px;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.6px solid var(--ink-3);background:var(--raised);display:grid;place-items:center;font-size:10px;line-height:1;color:var(--on-solid);font-weight:700}
.stp:hover{border-color:var(--ink)}
.stp.ok{background:var(--ok);border-color:var(--ok)}
.stp.ok + span{color:var(--ink-2)}
.wmeta{margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.wlink{font-size:12.5px;font-weight:600;color:var(--accent)}
.wlink:hover{text-decoration:underline}
.agl{font:inherit;font-weight:600;color:var(--ink);text-align:left}
.agl:hover{color:var(--accent);text-decoration:underline}
.wk tr.flash td{animation:flashbg 1.4s ease}
@keyframes flashbg{0%{background:var(--hl-soft)}100%{background:transparent}}
/* an accomplishment is met or failed only when you mark it */
.mk{flex:0 0 20px;width:20px;height:20px;margin-top:2px;border:1.8px solid var(--ink-2);border-radius:5px;background:var(--raised);display:grid;place-items:center;color:var(--on-solid);font-size:12px;font-weight:700;line-height:1}
.mk:hover{border-color:var(--ink)}
.mk.met{background:var(--ok);border-color:var(--ok)}
.mk.failed{background:var(--bad);border-color:var(--bad)}
.fail{flex:0 0 auto;color:var(--ink-3);font-size:12.5px;padding:2px 6px;border-radius:5px}
.fail:hover{color:var(--bad);background:var(--bad-soft)}

.rpanel{position:relative;margin-top:14px;border:1px solid var(--line);border-radius:11px;padding:14px 18px 16px;background:var(--surface-2)}
.rpanel.alt{background:var(--raised)}
.rpanel::before{content:"";position:absolute;top:-8px;left:calc(var(--nx, 50%) - 7px);width:14px;height:14px;background:inherit;border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.rpanel.alt .rbox:not(.met):not(.failed){background:var(--surface-2)}
.rpanel:not(.alt) .rbox:not(.met):not(.failed){background:var(--raised)}
.rph{display:flex;gap:11px;align-items:flex-start;margin-bottom:12px}
.rfull{font-family:var(--read);font-size:16.5px;font-weight:500;line-height:1.45;max-width:70ch}
.rph .rfull + button{margin-left:auto}
.rph .fail{margin-top:1px}
.rx{flex:0 0 auto;margin-top:1px;color:var(--ink-3);font-size:12.5px;padding:2px 6px;border-radius:5px}
.rx:hover{color:var(--ink);background:var(--line-2)}
.none{font-family:var(--read);font-style:italic;color:var(--ink-3);margin:0}
.adds{display:flex;gap:8px;margin-top:14px}
.addb{font-size:12.5px;font-weight:600;color:var(--ink-3);border:1px dashed var(--line);border-radius:7px;padding:4px 10px}
.addb:hover{color:var(--ink);border-color:var(--ink-3)}

/* ---------- artifacts: collapsible groups ---------- */
.grps{display:grid;gap:10px}
.grp{border:1px solid var(--line);border-radius:10px;background:var(--raised);overflow:hidden}
.grp > summary{display:flex;align-items:baseline;gap:10px;padding:12px 16px;cursor:pointer;list-style:none;background:var(--surface-2)}
.grp > summary::-webkit-details-marker{display:none}
.grp > summary:hover{background:var(--sum-hover)}
.gchev{flex:0 0 12px;font-size:11px;color:var(--ink-3);transition:transform .15s;display:inline-block}
.grp[open] > summary .gchev{transform:rotate(90deg)}
.grp[open] > summary{border-bottom:1px solid var(--line-2)}
.grp h3{margin:0;font-family:var(--read);font-size:17px;font-weight:600}
.gmeta{margin-left:auto;font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.gbody{padding:6px 16px 14px}
.grp .upload{margin-top:8px}
/* artifacts that come out of accomplishments */
.arow{display:grid;grid-template-columns:76px minmax(0,1fr) auto auto;gap:6px 14px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line-2)}
.arow:first-child{border-top:0}
.akind{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.atitle{font-family:var(--read);font-size:16px;font-weight:600}
.from{justify-self:start;font-size:12.5px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 10px;white-space:nowrap}
.from:hover{background:var(--accent-hover)}
.arow .dl{margin:0}
.arow.planned .atitle{color:var(--ink-3);font-weight:500}
.when{font-size:12.5px;color:var(--ink-3);font-style:italic;white-space:nowrap}
.rbox.flash{animation:flash 1.2s ease}

/* ---------- report tables ---------- */
table.wk{width:100%;border-collapse:collapse}
.wk td{padding:11px 8px;border-top:1px solid var(--line-2);vertical-align:baseline}
.wk tr:first-child td{border-top:0}
.wk .d{font-family:var(--read);font-size:16px;font-weight:600;white-space:nowrap;width:150px}
.wk .d small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--ink-3)}
.wk .ag{font-size:14px;color:var(--ink-2)}
.wk .ag b{font-weight:600;color:var(--ink)}
.wk .f{text-align:right;white-space:nowrap}
.pdf{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;color:var(--pdf-ink);background:var(--pdf-bg);border-radius:6px;padding:2px 9px;text-decoration:none;margin-left:6px}
.dl{font-size:13px;font-weight:600;text-decoration:none;margin-left:10px}
.upload{margin-top:10px;display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px dashed var(--line);border-radius:10px;color:var(--ink-3);font-size:14px}
.upload b{color:var(--ink-2)}

@media (max-width:760px){
  .top{padding:8px 14px;gap:10px;flex-wrap:wrap} .nav{order:3;width:100%}
  main{padding:16px 10px 50px}
  .shead{padding:14px 16px} .sbody{padding:0 14px 18px}
  .acc{padding:13px 16px 16px} .claim{font-size:19px}
  .junc{height:auto;justify-content:flex-start;margin:18px 0 8px} .junc::before{display:none}
  .pill{border:0;padding:0;background:none;color:var(--ink-3)}
  .mgrid{grid-template-columns:minmax(0,1fr);gap:8px;padding-top:0} .mgrid::before,.mbox::before{display:none}
  .mbox{flex-direction:row;justify-content:space-between;align-items:baseline;min-height:0;padding:13px 15px;text-align:left;gap:10px}
  .ms{white-space:nowrap}
  .panel{padding:14px 16px 12px}
  .lines{gap:18px}
  .line{display:flex;flex-direction:column;gap:8px}
  .line.seq{gap:28px}
  .arrow{top:100%;left:22px;width:14px;height:28px;margin-top:0;padding:5px 0}
  .arrow .h{display:none} .arrow .v{display:block}
  .rbox{flex:none;min-height:0;flex-direction:row;justify-content:flex-start;align-items:center;text-align:left;gap:10px;padding:12px 34px 12px 14px}
  .rnum{position:static;order:-1}
  .rsub{margin:0}
  .pips{margin-left:auto}
  .rpanel{padding:12px 10px 12px} .cell > .rpanel{margin-top:10px}
  .wrow{grid-template-columns:minmax(0,1fr) 14px;gap:2px 10px} .wst{grid-column:1 / -1} .wdet{padding:0 12px 12px 12px}
  .rph{flex-wrap:wrap;row-gap:4px} .rph .rfull{flex:1 1 calc(100% - 34px)} .rph .rfull + button{margin-left:25px}
  .wk td{display:block;border-top:0;padding:2px 0} .wk tr{display:block;border-top:1px solid var(--line-2);padding:10px 0} .wk .f{text-align:left}
  .gbody{padding:4px 12px 12px} .grp > summary{padding:12px}
  .wk tr:first-child{border-top:0} .upload{display:block;line-height:1.45}
  .arow{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px} .akind{grid-column:1 / -1} .from{grid-column:1 / -1}
}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} .panel.flash{animation:none} }


/* ================= app chrome ================= */
:root{ --on-accent:#fff; --danger:#AF3D2D; }
html,body{min-height:100%}
#app{display:flex;flex-direction:column;min-height:100vh}
#app > main{flex:1 0 auto;width:100%}
input,select,textarea{font:inherit;color:var(--ink)}
input[type=text],input[type=url],input[type=date],input[type=password],select{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14.5px}
input:focus,select:focus{outline:2px solid var(--accent-line);border-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
::placeholder{color:var(--ink-3);opacity:1}
.nav a[aria-current="true"]{color:var(--ink)}
.docbtn.unset{border-style:dashed;color:var(--ink-3)}
.foot{display:flex;align-items:center;gap:16px;padding:7px 22px;border-top:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--ink-3)}
.foot .spacer{flex:1}
.foot .sync{display:inline-flex;align-items:center;gap:7px}
.foot .sync i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.foot .sync.busy i{background:var(--hl)}
.foot .sync.bad{color:var(--bad)} .foot .sync.bad i{background:var(--bad)}
.foot button{font-size:12.5px;color:var(--ink-3);font-weight:500}
.foot button:hover{color:var(--accent)}
.foot button.go{color:var(--accent);font-weight:600}
.toast{position:fixed;right:18px;bottom:52px;max-width:min(420px,calc(100% - 36px));padding:9px 14px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:40}

/* password gate and token setup */
.gate{margin:12vh auto 40px;width:calc(100% - 32px);max-width:400px;padding:28px 28px 24px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:grid;gap:14px}
.gate.wide{max-width:560px}
.gatebrand{display:flex;align-items:center;gap:12px}
.gatebrand svg{width:30px;height:30px;color:var(--accent)}
.gate h2{margin:0;font-family:var(--read);font-weight:600;font-size:24px}
.gate .gsub{margin:0;font-size:13px;color:var(--ink-3)}
.gate p{margin:0;color:var(--ink-2);font-size:14.5px}
.gate .err{color:var(--bad);font-size:13.5px}
.gate footer{display:flex;justify-content:flex-end;gap:8px}
.gate code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.gate ol{margin:0;padding-left:20px;display:grid;gap:5px;font-size:14px;color:var(--ink-2)}
.field{display:grid;gap:5px}
.field > span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.state{margin:14vh auto;max-width:460px;text-align:center;color:var(--ink-2)}
.state h2{font-family:var(--read);font-weight:600;color:var(--ink)}
.btn.big{padding:8px 16px;font-size:14px}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.btn:disabled{opacity:.55;cursor:default}

/* forms inside panels */
.form{display:grid;gap:10px;margin:2px 0 4px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--raised)}
.form h4{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.frow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;align-items:baseline}
.frow > label{font-size:13px;font-weight:600;color:var(--ink-2);padding-top:7px}
.frow .sub{font-size:12px;color:var(--ink-3);margin-top:3px}
.fact{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fact .grow{flex:1}
.ferr{color:var(--bad);font-size:13px}
.confirm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:var(--bad-soft);font-size:13.5px;color:var(--ink)}
.textlink{font-size:12.5px;font-weight:600;color:var(--accent);padding:2px 6px;border-radius:5px}
.textlink:hover{background:var(--accent-soft)}
.textlink.quiet{color:var(--ink-3);font-weight:500}
.textlink.quiet:hover{color:var(--ink);background:var(--line-2)}
.drop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border:1.5px dashed var(--line);border-radius:9px;font-size:13.5px;color:var(--ink-3)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--ink-2)}
.drop input[type=file]{font-size:13px;max-width:100%}
.picks{display:grid;gap:4px;max-height:280px;overflow:auto;padding:6px 8px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface)}
.picks label{display:flex;gap:9px;align-items:baseline;font-size:14px;line-height:1.4;padding:3px 2px}
.picks label small{color:var(--ink-3);font-size:12px}
.picks .none{font-size:13.5px}

/* roadmap additions */
.rph .rtools{display:flex;gap:2px;align-items:center;margin-left:auto;flex:0 0 auto}
.rph .rfull + .rtools{margin-left:auto}
.addtop{margin-top:14px}
.stepadd{display:flex;gap:10px;align-items:center;margin-top:6px}
.stepadd .plus{flex:0 0 18px;width:18px;height:18px;border-radius:50%;border:1.6px dashed var(--line);display:grid;place-items:center;font-size:12px;color:var(--ink-3)}
.stepadd input{border:0;border-bottom:1px dashed var(--line);border-radius:0;background:transparent;padding:3px 2px;font-size:14px}
.stepadd input:focus{outline:none;border-bottom-color:var(--accent)}
.wmeta{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.wmeta .grow{flex:1}
.emptyroad{font-family:var(--read);font-style:italic;color:var(--ink-3);margin:0 0 10px}

/* artifacts additions */
.grp .rowtools{white-space:nowrap}
.wk .f .textlink{margin-left:6px}
.pdf{cursor:pointer;border:0}
.pdf.busy{opacity:.6;cursor:progress}
.wk .ag .none{color:var(--ink-3)}
.gempty{margin:6px 0 10px;font-family:var(--read);font-style:italic;color:var(--ink-3);font-size:14.5px}
.addrow{margin-top:8px}
.arow .acts2{display:flex;gap:8px;align-items:baseline;justify-content:flex-end;flex-wrap:wrap}

/* ================= dark ================= */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121715; --surface:#1B2120; --surface-2:#222A28; --raised:#262F2D; --on-solid:#0F1513; --on-accent:#0E1A2E;
    --ink:#E3EAE7; --ink-2:#AEBBB7; --ink-3:#86948F; --line:#33403C; --line-2:#29322F;
    --accent:#93B3F0; --accent-soft:#1F2A40; --accent-line:#415D90; --accent-hover:#26344F;
    --hl:#D9BC4C; --hl-soft:#36311C; --hl-line:#6B5E2A; --hl-hover:#433C21; --hl-ring:#D9BC4C; --now-ink:#E5CB62;
    --ok:#6CC08E; --ok-soft:#183424; --ok-line:#2F6B47; --ok-hover:#1E3F2C;
    --bad:#EC7A66; --bad-soft:#3E211B; --bad-line:#7A3A2E;
    --pattern:linear-gradient(rgba(170,210,190,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(170,210,190,.045) 1px,transparent 1px);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.6); --sum-hover:#26302D; --pdf-ink:#F2A496; --pdf-bg:#3E211B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121715; --surface:#1B2120; --surface-2:#222A28; --raised:#262F2D; --on-solid:#0F1513; --on-accent:#0E1A2E;
  --ink:#E3EAE7; --ink-2:#AEBBB7; --ink-3:#86948F; --line:#33403C; --line-2:#29322F;
  --accent:#93B3F0; --accent-soft:#1F2A40; --accent-line:#415D90; --accent-hover:#26344F;
  --hl:#D9BC4C; --hl-soft:#36311C; --hl-line:#6B5E2A; --hl-hover:#433C21; --hl-ring:#D9BC4C; --now-ink:#E5CB62;
  --ok:#6CC08E; --ok-soft:#183424; --ok-line:#2F6B47; --ok-hover:#1E3F2C;
  --bad:#EC7A66; --bad-soft:#3E211B; --bad-line:#7A3A2E;
  --pattern:linear-gradient(rgba(170,210,190,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(170,210,190,.045) 1px,transparent 1px);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.6); --sum-hover:#26302D; --pdf-ink:#F2A496; --pdf-bg:#3E211B;
}

@media (max-width:760px){
  .foot{padding:7px 12px;gap:12px;flex-wrap:wrap}
  .frow{grid-template-columns:minmax(0,1fr)} .frow > label{padding-top:0}
  .form{padding:12px}
  .toast{right:10px;left:10px;max-width:none;bottom:50px}
}
@media (max-width:760px){ .rph .rfull + .rtools{margin-left:25px} }
.ovl{position:fixed;inset:0;z-index:50;background:rgba(15,20,18,.38);display:grid;place-items:center;padding:16px}
.ovlbox{width:min(520px,100%);box-shadow:var(--shadow)}
button.upload{width:100%;text-align:left;background:transparent;cursor:pointer}
button.upload:hover{border-color:var(--ink-3);color:var(--ink-2)}
.claim .hint{font-size:16px}
.vform{display:grid;gap:10px}
.vform .frow{grid-template-columns:60px minmax(0,1fr)}
.rpanel > .form{margin-bottom:12px}
.wact > .form{margin:4px 10px 8px}
.wk td[colspan]{padding:8px 0}
</style>

const $ = (s, r) => (r || document).querySelector(s);

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TODAY = (t => t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'))(new Date());
function fmt(d){ if (!d) return ''; const [y, m, dd] = d.split('-').map(Number); return MONTHS[m - 1] + ' ' + dd + (y !== Number(TODAY.slice(0, 4)) ? ', ' + y : ''); }
function shiftDay(d, k){ const [y, m, dd] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd + k)).toISOString().slice(0, 10); }
const nowIso = () => new Date().toISOString();
const timeShort = () => new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- a small writer: "## heading", paragraphs, "- " bullets nested by two spaces, **bold**, *italic*, ==mark== ----------
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/==(.+?)==/g, '<mark>$1</mark>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>');

  let html = '', stack = [], para = [];
  const flushP = () => { if (para.length){ html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
  const closeAll = () => { while (stack.length){ html += '</li></ul>'; stack.pop(); } };
  for (const raw of String(src || '').replace(/\r/g, '').split('\n')){
    const m = raw.match(/^(\s*)[-*]\s+(.*)$/);
    if (m){
      flushP();
      const lv = Math.floor(m[1].replace(/\t/g, '  ').length / 2);
      if (!stack.length || lv > stack[stack.length - 1]){ html += '<ul><li>'; stack.push(lv); }
      else { while (stack.length > 1 && lv < stack[stack.length - 1]){ html += '</li></ul>'; stack.pop(); } html += '</li><li>'; }
      html += inline(m[2]); continue;
    }
    if (!raw.trim()){ closeAll(); flushP(); continue; }
    if (/^#{1,3}\s+/.test(raw)){ closeAll(); flushP(); html += '<h4>' + inline(raw.replace(/^#{1,3}\s+/, '')) + '</h4>'; continue; }
    closeAll(); para.push(raw.trim());
  }

  return html || '<p class="empty">Nothing written yet.</p>';
}

async function saveToken(t){

    if (!probe.ok) throw new Error('GitHub answered ' + probe.status);

// lists of items with ids: union by id, the newer 'updated' wins, removed ids stay removed
function mergeList(r, l, gone){
  const byId = new Map(), order = [];

}

function mergeStates(remote, local){

async function doSave(){

    try { stateSha = await ghPut(SITE.stateFile, token, text, stateSha, 'Routebook update'); }
    catch(e){
      if (!e.conflict) throw e;

async function refreshFromRepo(manual){

const fileCache = new Map();
async function uploadPdf(file){
  if (!file) return null;
  if (file.size > 25 * 1024 * 1024) throw new Error('That PDF is over 25 MB. Export a smaller one.');
  const bytes = new Uint8Array(await file.arrayBuffer());
  const path = 'files/' + uid('f') + '.pdf.enc';
  uploading++; setSync('saving', 'Uploading the PDF…');
  try { await ghPutBytes(path, token, await encryptBytes(bytes), 'Routebook: add a report'); }
  finally { uploading--; }
  fileCache.set(path, bytes);
  return {path, name: file.name || 'report.pdf', size: file.size};
}
async function openPdf(f, btn){
  if (!f || !f.path) return;
  const w = window.open('', '_blank');
  if (w){ try { w.document.title = f.name || 'Report'; w.document.body.style.cssText = 'font:15px system-ui;color:#555;padding:24px'; w.document.body.textContent = 'Opening ' + (f.name || 'the report') + '…'; } catch(e){} }
  if (btn) btn.classList.add('busy');
  try {
    let bytes = fileCache.get(f.path);
    if (!bytes){ const enc = await ghGetBytes(f.path, token); if (!enc) throw new Error('the file is missing from the repository'); bytes = await decryptBytes(enc); fileCache.set(f.path, bytes); }
    const url = URL.createObjectURL(new Blob([bytes], {type: 'application/pdf'}));
    if (w && !w.closed) w.location.href = url;
    else { const a = document.createElement('a'); a.href = url; a.download = f.name || 'report.pdf'; document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(() => URL.revokeObjectURL(url), 120000);
  } catch(e){ if (w && !w.closed) w.close(); toast('Could not open the PDF: ' + (e.message || e)); }
  finally { if (btn) btn.classList.remove('busy'); }
}

      (mrows ? `<table class="wk">${mrows}</table>` : '<p class="gempty">No meeting reports yet.</p>') + adder('meeting', '+ Add a meeting report', 'its PDF and a link to the slides'))
    + grp('outputs', 'From the roadmap', outs.length ? `${outs.filter(o => !o.planned).length} made · ${outs.filter(o => o.planned).length} to come` : 'none yet',
      (orows || '<p class="gempty">Nothing yet. Papers, models and datasets that accomplishments produce go here.</p>') + adder('output', '+ Add an artifact', 'a paper, model, dataset or anything an accomplishment produced'));
}

// ================= Project Doc link =================
function renderOverlay(){
  const el = $('#overlay'); if (!el) return;
  if (overlay !== 'doc'){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="ovl" data-x="ovlclose"><form data-form="doclink" class="form ovlbox" role="dialog" aria-label="Project Doc link"><h4>Project Doc link</h4><p class="hint" style="margin:0">The Google Doc where you write the weekly updates. Its sharing settings decide who can open it.</p><input type="text" inputmode="url" autocomplete="off" name="url" value="${esc(B().settings.docUrl)}" placeholder="https://docs.google.com/document/d/…"><div class="fact"><button class="btn pri" type="submit">Save</button><button class="btn" type="button" data-x="ovlclose">Cancel</button><span class="grow"></span>${B().settings.docUrl ? '<button class="btn danger" type="button" data-x="docclear">Remove</button>' : ''}</div></form></div>`;
  const i = $('input[name=url]', el); if (i) i.focus();
}


// ================= actions =================
function depthOf(el){ let d = 0, x = el.parentElement; const road = $('#road'); while (x && x !== road){ if (x.classList.contains('rpanel')) d++; x = x.parentElement; } return d; }
function openSection(id){ const s = $('#' + id); if (s && s.classList.contains('shut')){ s.classList.remove('shut'); shut[id] = false; lsSet('rb2.shut', shut); } }
function scrollFlash(el){ if (!el) return; el.scrollIntoView({block: 'center', behavior: reduced() ? 'auto' : 'smooth'}); flash(el); }
function parseSteps(text){ return String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => { const m = l.match(/^\[( |x|X)\]\s*/); return {t: m ? l.slice(m[0].length) : l, ok: !!(m && m[1] !== ' ')}; }).filter(s => s.t); }
function moveSibling(n, dir){
  const sibs = kidsOf(n.parent).filter(x => x.kind === n.kind), i = sibs.indexOf(n), t = sibs[i + dir]; if (!t) return;
  const arr = nodes(), a = arr.indexOf(n), b = arr.indexOf(t); arr[a] = t; arr[b] = n; touch(n); touch(t);
}
function removeNode(n){
  const ids = subtree(n.id), gone = new Set(ids);
  for (const s of nodes()) if (!gone.has(s.id) && s.after === n.id){ s.after = n.after || null; touch(s); }
  for (const o of B().outputs) if (gone.has(o.from)){ o.from = null; touch(o); }
  B().nodes = nodes().filter(x => !gone.has(x.id)); tomb(ids);
  if (gone.has(openAct)) openAct = null;
  path = path.filter(id => !gone.has(id));
}
function gotoAct(id){ const a = nodeById(id); if (!a) return; path = ancestors(id); openAct = id; openSection('roadmap'); renderRoad(); scrollFlash($(`.wact[data-aid="${id}"]`)); }
function gotoAcc(id){ if (!nodeById(id)) return; path = ancestors(id).concat(id); openSection('roadmap'); renderRoad(); scrollFlash($(`.rbox[data-rid="${id}"]`)); }
function gotoWeek(id){ openSection('artifacts'); grpOpen.weekly = true; lsSet('rb2.grps', grpOpen); const g = $('#grp-weekly'); if (g) g.open = true; scrollFlash($(`tr[data-wrow="${id}"]`)); }
const recOf = where => { const [k, id] = where.split(':'); const list = k === 'weekly' ? B().weekly : k === 'meeting' ? B().meetings : B().outputs; return list.find(x => x.id === id) || null; };

document.addEventListener('click', e => {
  const t = e.target;
  // collapse a section by its heading
  const sh = t.closest('.shead');
  if (sh && !t.closest('button')){ const s = sh.parentElement; s.classList.toggle('shut'); shut[s.id] = s.classList.contains('shut'); lsSet('rb2.shut', shut); if (!shut[s.id]){ renderMotivation(); renderRoad(); } return; }
  if (t.id === 'readall'){ vAll = !vAll; vOpen = null; if (vEdit !== 'claim') vEdit = null; renderVision(); return; }
  // ----- roadmap -----
  const rb = t.closest('.rbox');
  if (rb){ const id = rb.dataset.rid, d = depthOf(rb); path = path[d] === id ? path.slice(0, d) : path.slice(0, d).concat(id); renderRoad(); const p = $(`.rpanel[data-for="${id}"]`); if (p) inView(p); return; }
  const rc = t.closest('[data-rclose]'); if (rc){ path = path.slice(0, +rc.dataset.rclose); if (redit && redit.kind === 'acc') redit = null; renderRoad(); return; }
  const mk = t.closest('[data-mark]'); if (mk){ const n = nodeById(mk.dataset.mark); n.st = n.st ? null : 'met'; touch(n); commit(); renderRoad(); return; }
  const fl = t.closest('[data-failed]'); if (fl){ const n = nodeById(fl.dataset.failed); n.st = 'failed'; touch(n); commit(); renderRoad(); return; }
  const ao = t.closest('[data-actopen]'); if (ao){ openAct = openAct === ao.dataset.actopen ? null : ao.dataset.actopen; renderRoad(); return; }
  const sp = t.closest('[data-step]'); if (sp){ const [id, i] = sp.dataset.step.split(':'); const a = nodeById(id); a.steps[+i].ok = !a.steps[+i].ok; touch(a); commit(); renderRoad(); return; }
  const re = t.closest('[data-redit]'); if (re){ const [kind, id] = re.dataset.redit.split(':'); redit = {kind, id}; if (kind === 'act') openAct = id; renderRoad(); const f = $(`form[data-form="${kind}:${id}"]`); if (f){ inView(f); const i = f.querySelector('input,textarea'); if (i) i.focus(); } return; }
  const ra = t.closest('[data-radd]'); if (ra){ const parent = ra.dataset.parent || null; redit = {kind: ra.dataset.radd === 'acc' ? 'newacc' : 'newact', parent}; renderRoad(); const f = $(`form[data-form="${redit.kind}:${parent || 'top'}"]`); if (f){ inView(f); f.querySelector('input').focus(); } return; }
  const ga = t.closest('[data-goact]'); if (ga){ gotoAct(ga.dataset.goact); return; }
  const go = t.closest('[data-goto]'); if (go){ gotoAcc(go.dataset.goto); return; }
  const wk = t.closest('[data-week]'); if (wk){ gotoWeek(wk.dataset.week); return; }
  // ----- artifacts -----
  const ae = t.closest('[data-aedit]'); if (ae){ const [kind, id] = ae.dataset.aedit.split(':'); const group = kind === 'weekly' ? 'weekly' : kind === 'meeting' ? 'meetings' : 'outputs'; aedit = {kind, id: id === 'new' ? null : id, group}; grpOpen[group] = true; lsSet('rb2.grps', grpOpen); renderArts(); const f = $(`form[data-form="${kind}:${id}"]`); if (f) inView(f); return; }
  const pd = t.closest('[data-pdf]'); if (pd){ const r = recOf(pd.dataset.pdf); if (r) openPdf(r.pdf, pd); return; }
  // ----- named actions -----
  const x = t.closest('[data-x]'); if (!x) return;
  const act = x.dataset.x;
  if (act === 'ovlclose'){ if (t === x || x.tagName === 'BUTTON'){ overlay = null; renderOverlay(); } return; }
  if (act === 'doclink'){ overlay = 'doc'; renderOverlay(); return; }
  if (act === 'docclear'){ B().settings = {docUrl: '', updated: nowIso()}; overlay = null; commit(); renderBoard(); return; }
  if (act === 'retry'){ doSave(); return; }
  if (act === 'refresh'){ refreshFromRepo(true); return; }
  if (act === 'token'){ tokenError = ''; dbState = 'needtoken'; render(); return; }
  if (act === 'lock'){ lock(); return; }
  if (act === 'vbox'){ const id = x.dataset.id; if (vAll){ const p = $('#panel-' + id); p.scrollIntoView({block: 'start'}); flash(p); return; } if (vEdit && vEdit !== 'claim') vEdit = null; vOpen = vOpen === id ? null : id; renderMotivation(); if (vOpen) inView($('#mgrid .panel')); return; }
  if (act === 'vclose'){ vOpen = null; if (vEdit !== 'claim') vEdit = null; renderMotivation(); return; }
  if (act === 'vedit'){ vEdit = x.dataset.id; if (vEdit === 'claim') renderAcc(); else renderMotivation(); const ta = vEdit === 'claim' ? $('#acc textarea') : $(`#panel-${vEdit} textarea`); if (ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } return; }
  if (act === 'vcancel'){ const was = vEdit; vEdit = null; if (was === 'claim') renderAcc(); else renderMotivation(); return; }
  if (act === 'rcancel'){ redit = null; renderRoad(); return; }
  if (act === 'rconfirm'){ redit.confirm = true; renderRoad(); return; }
  if (act === 'rkeep'){ redit.confirm = false; renderRoad(); return; }
  if (act === 'rdel'){ const n = nodeById(redit.id); if (n) removeNode(n); redit = null; commit(); renderBoard(); toast('Deleted.'); return; }
  if (act === 'rmove'){ const n = nodeById(redit.id); if (n){ moveSibling(n, +x.dataset.dir); commit(); renderRoad(); } return; }
  if (act === 'acancel'){ aedit = null; renderArts(); return; }
  if (act === 'aconfirm'){ aedit.confirm = true; renderArts(); return; }
  if (act === 'akeep'){ aedit.confirm = false; renderArts(); return; }
  if (act === 'adel'){
    const list = aedit.kind === 'weekly' ? 'weekly' : aedit.kind === 'meeting' ? 'meetings' : 'outputs'; const r = B()[list].find(y => y.id === aedit.id);
    if (r && list === 'weekly') for (const id of r.agreed || []){ const a = nodeById(id); if (a && a.agreed === r.date){ a.agreed = null; touch(a); } }
    B()[list] = B()[list].filter(y => y.id !== aedit.id); tomb([aedit.id]); aedit = null; commit(); renderBoard(); toast('Deleted.'); return;
  }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details[data-grp]')){ grpOpen[d.dataset.grp] = d.open; lsSet('rb2.grps', grpOpen); } }, true);

// ----- forms -----
const val = (f, n) => (f.elements[n] ? String(f.elements[n].value || '') : '');
function formError(f, msg){ const p = f.querySelector('.ferr'); if (p){ p.textContent = msg; p.hidden = !msg; } }
function busy(f, on, label){ const b = f.querySelector('button[type=submit]'); if (!b) return; if (on){ b.dataset.label = b.textContent; b.textContent = label || 'Saving…'; } else if (b.dataset.label) b.textContent = b.dataset.label; b.disabled = !!on; }
async function filePart(f, existing){ const file = f._file || (f.elements.pdf && f.elements.pdf.files[0]) || null; if (!file) return existing || null; busy(f, true, 'Uploading…'); return uploadPdf(file); }
document.addEventListener('submit', async e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'gateform'){ unlock(f.password.value, f.remember.checked); return; }
  if (f.id === 'tokenform'){ saveToken(f.token.value); return; }
  const key0 = f.dataset.form; if (!key0) return;
  const [kind, id] = key0.split(':');
  if (kind === 'claim'){ B().claim = {text: val(f, 'text').trim(), updated: nowIso()}; vEdit = null; commit(); renderAcc(); return; }
  if (kind === 'part'){ const p = B().parts.find(x => x.id === id); p.title = val(f, 'title').trim() || p.title; p.body = val(f, 'body').replace(/\s+$/, ''); touch(p); vEdit = null; commit(); renderMotivation(); return; }
  if (kind === 'doclink'){ B().settings = {docUrl: safeUrl(val(f, 'url')), updated: nowIso()}; overlay = null; commit(); renderBoard(); return; }
  if (kind === 'acc' || kind === 'newacc'){
    const short = val(f, 'short').trim(); if (!short) return;
    const full = val(f, 'full').trim(), sub = val(f, 'sub').trim(), after = f.elements.after ? val(f, 'after') || null : null;
    if (kind === 'acc'){ const n = nodeById(id); Object.assign(n, {short, full, sub, after: n.parent ? after : null}); touch(n); }
    else { const parent = id === 'top' ? null : id; const n = {id: uid('n'), parent, kind: 'acc', short, full, sub, after, st: null, updated: nowIso()}; nodes().push(n); if (parent){ path = ancestors(parent).concat(parent); } setTimeout(() => flash($(`.rbox[data-rid="${n.id}"]`)), 30); }
    redit = null; commit(); renderRoad(); return;
  }
  if (kind === 'act' || kind === 'newact'){
    const name = val(f, 'name').trim(); if (!name) return;
    const steps = parseSteps(val(f, 'steps')), agreed = val(f, 'agreed') || null;
    if (kind === 'act'){ const a = nodeById(id); Object.assign(a, {name, steps, agreed}); touch(a); }
    else { const a = {id: uid('a'), parent: id, kind: 'act', name, steps, agreed, updated: nowIso()}; nodes().push(a); openAct = a.id; }
    redit = null; commit(); renderRoad(); return;
  }
  // reports and artifacts can carry an encrypted PDF
  try {
    formError(f, '');
    if (kind === 'weekly'){
      const date = val(f, 'date'); if (!date){ formError(f, 'Pick the meeting date.'); return; }
      const w = id === 'new' ? null : B().weekly.find(x => x.id === id);
      const pdf = await filePart(f, w && w.pdf);
      const agreed = $$('input[name=agreed]:checked', f).map(x => x.value);
      const r = w || {id: uid('w')}; const oldDate = r.date, oldAgreed = r.agreed || [];
      Object.assign(r, {date, pdf, doc: safeUrl(val(f, 'doc')), agreed, updated: nowIso()});
      if (!w) B().weekly.push(r);
      for (const aid of oldAgreed) if (!agreed.includes(aid)){ const a = nodeById(aid); if (a && a.agreed === oldDate){ a.agreed = null; touch(a); } }
      for (const aid of agreed){ const a = nodeById(aid); if (a){ a.agreed = date; touch(a); } }
    } else if (kind === 'meeting'){
      const date = val(f, 'date'); if (!date){ formError(f, 'Pick the date.'); return; }
      const m = id === 'new' ? null : B().meetings.find(x => x.id === id);
      const pdf = await filePart(f, m && m.pdf);
      const r = m || {id: uid('m')}; Object.assign(r, {date, title: val(f, 'title').trim() || 'Project meeting', pdf, link: safeUrl(val(f, 'link')), updated: nowIso()});
      if (!m) B().meetings.push(r);
    } else if (kind === 'output'){
      const title = val(f, 'title').trim(); if (!title){ formError(f, 'Give it a title.'); return; }
      const o = id === 'new' ? null : B().outputs.find(x => x.id === id);
      const pdf = await filePart(f, o && o.pdf);
      const r = o || {id: uid('o')}; Object.assign(r, {kind: val(f, 'kind') || 'Other', title, from: val(f, 'from') || null, link: safeUrl(val(f, 'link')), pdf, planned: !!(f.elements.planned && f.elements.planned.checked), updated: nowIso()});
      if (!o) B().outputs.push(r);
    } else return;
    aedit = null; commit(); renderBoard();
  } catch(err){ busy(f, false); formError(f, 'Not saved: ' + (err.message || err)); setSync('error', 'PDF not uploaded'); }
});
document.addEventListener('change', e => { const i = e.target; if (i.type === 'file' && i.name === 'pdf'){ const f = i.closest('form'); f._file = i.files[0] || null; const n = f.querySelector('.fname'); if (n) n.textContent = f._file ? f._file.name : ''; } });
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('[data-drop]'); if (d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('[data-drop]'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('[data-drop]'); if (!d) return; e.preventDefault(); d.classList.remove('over'); const file = Array.from(e.dataTransfer.files || []).find(x => /pdf$/i.test(x.type) || /\.pdf$/i.test(x.name)); if (!file){ toast('Drop a PDF file.'); return; } const f = d.closest('form'); f._file = file; const n = f.querySelector('.fname'); if (n) n.textContent = file.name; });
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches && t.matches('input[data-stepadd]') && e.key === 'Enter'){
    e.preventDefault(); const v = t.value.trim(); if (!v) return; const a = nodeById(t.dataset.stepadd); a.steps.push({t: v, ok: false}); touch(a); commit(); renderRoad();
    const i = $(`input[data-stepadd="${a.id}"]`); if (i) i.focus(); return;
  }
  if (t.matches && t.matches('textarea') && (e.metaKey || e.ctrlKey) && e.key === 'Enter'){ const f = t.closest('form'); if (f){ e.preventDefault(); f.requestSubmit(); } return; }
  if (t.matches && t.matches('#mgrid textarea') && e.key === 'Tab'){
    e.preventDefault(); const s = t.selectionStart, ls = t.value.lastIndexOf('\n', s - 1) + 1;
    if (e.shiftKey){ if (t.value.slice(ls, ls + 2) === '  '){ t.value = t.value.slice(0, ls) + t.value.slice(ls + 2); t.setSelectionRange(Math.max(ls, s - 2), Math.max(ls, s - 2)); } }
    else { t.value = t.value.slice(0, ls) + '  ' + t.value.slice(ls); t.setSelectionRange(s + 2, s + 2); }
    return;
  }
  if (e.key !== 'Escape' || !state || dbState !== 'ready') return;
  if (overlay){ overlay = null; renderOverlay(); return; }
  if (vEdit){ const was = vEdit; vEdit = null; if (was === 'claim') renderAcc(); else renderMotivation(); return; }
  if (redit){ redit = null; renderRoad(); return; }
  if (aedit){ aedit = null; renderArts(); return; }
  if (t.matches && t.matches('input,textarea,select')) return;
  if (vOpen){ vOpen = null; renderMotivation(); return; }
  if (openAct){ openAct = null; renderRoad(); return; }
  if (path.length){ path = path.slice(0, -1); renderRoad(); }
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (dbState === 'ready' && state){ const snap = captureForms(); renderMotivation(); renderRoad(); restoreForms(snap); } }, 150); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (dbState === 'ready' && state){ const snap = captureForms(); renderMotivation(); renderRoad(); restoreForms(snap); } });
boot();

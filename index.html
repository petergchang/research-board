<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMK Routebook</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400..700;1,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
  svg: { fontCache: 'global' },
  options: { enableMenu: false },
  startup: { typeset: false, ready(){ MathJax.startup.defaultReady(); MathJax.startup.promise.then(() => { window.__mjReady = true; if (window.__typesetAll) window.__typesetAll(); }); } }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" async></script>
<style>
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#ECEDF3; --surface-3:#E3E5EE;
  --ink:#1B1D2A; --ink-2:#4E5368; --ink-3:#7F8499;
  --line:#D8DBE6; --line-2:#E9EBF1;
  --accent:#3E3C9B; --accent-ink:#2F2D7C; --accent-soft:#E9E8F8; --accent-line:#B9B7E6; --on-accent:#FFFFFF;
  --ok:#2B7F55; --ok-soft:#DDF0E5;
  --warn:#A8651A; --warn-soft:#F8EAD3;
  --bad:#B7412F; --bad-soft:#F8E0DB;
  --run:#1D7C86; --run-soft:#D8EDF0;
  --det:#1F5FA8; --det-soft:#E5EEF9; --det-line:#8FB2E0;
  --lrn:#BF3E2C; --lrn-soft:#FBE7E2; --lrn-line:#E4A093;
  --io:#5B6472; --io-soft:#EEF0F4;
  --shadow:0 1px 2px rgba(27,29,42,.05), 0 6px 20px rgba(27,29,42,.07);
  --display:'Newsreader', 'Iowan Old Style', Georgia, serif;
  --body:'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  --mono:'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13141B; --surface:#1B1D27; --surface-2:#232633; --surface-3:#2B2F3E;
    --ink:#E7E8F0; --ink-2:#ABAFC2; --ink-3:#7E8399;
    --line:#2F3345; --line-2:#262A38;
    --accent:#A5A3F3; --accent-ink:#C4C2FA; --accent-soft:#272948; --accent-line:#4C4A9C; --on-accent:#14142B;
    --ok:#62C08E; --ok-soft:#1B3628;
    --warn:#E2A455; --warn-soft:#3B2D16;
    --bad:#E8735F; --bad-soft:#40201A;
    --run:#5FC0CA; --run-soft:#163236;
    --det:#7CB0EE; --det-soft:#1B2A40; --det-line:#3D6598;
    --lrn:#F08A73; --lrn-soft:#3C201B; --lrn-line:#8E4A3C;
    --io:#AEB4C0; --io-soft:#232633;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#13141B; --surface:#1B1D27; --surface-2:#232633; --surface-3:#2B2F3E;
  --ink:#E7E8F0; --ink-2:#ABAFC2; --ink-3:#7E8399;
  --line:#2F3345; --line-2:#262A38;
  --accent:#A5A3F3; --accent-ink:#C4C2FA; --accent-soft:#272948; --accent-line:#4C4A9C; --on-accent:#14142B;
  --ok:#62C08E; --ok-soft:#1B3628;
  --warn:#E2A455; --warn-soft:#3B2D16;
  --bad:#E8735F; --bad-soft:#40201A;
  --run:#5FC0CA; --run-soft:#163236;
  --det:#7CB0EE; --det-soft:#1B2A40; --det-line:#3D6598;
  --lrn:#F08A73; --lrn-soft:#3C201B; --lrn-line:#8E4A3C;
  --io:#AEB4C0; --io-soft:#232633;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg g[tabindex]:focus{outline:none}
select,textarea,input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
textarea{resize:vertical;min-height:84px;line-height:1.4}
[hidden]{display:none!important}
.nid{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--accent);white-space:nowrap}
.mono{font-family:var(--mono);font-size:12px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
kbd{font-family:var(--body);font-size:12px;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--surface);color:var(--ink-2)}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;align-items:center;gap:20px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.top .titleblock{min-width:0;flex:1 1 auto}
.top .eyebrow{margin-bottom:1px}
.top h1{font-family:var(--display);font-size:24px;font-weight:500;line-height:1.15;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex:0 0 auto}
.tabs button{padding:6px 14px;border-radius:6px;font-weight:500;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:7px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{padding:5px 10px;font-size:13px;font-weight:500}
.btn.ghost{border-color:transparent;color:var(--accent);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}

.main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.foot{display:flex;align-items:center;gap:14px;padding:8px 20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);background:var(--surface)}
.foot .spacer{flex:1}

/* ---------- status pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em;line-height:18px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.pill.done,.pill.resolved,.pill.released,.pill.built,.pill.living{background:var(--ok-soft);color:var(--ok)}
.pill.active,.pill.running{background:var(--run-soft);color:var(--run)}
.pill.blocked{background:var(--bad-soft);color:var(--bad)}
.pill.reshaped,.pill.draft,.pill.outline{background:var(--warn-soft);color:var(--warn)}
.pill.open{background:var(--accent-soft);color:var(--accent)}
.pill.planned,.pill.parked,.pill.not-started{background:var(--surface-2);color:var(--ink-3)}
.pill.parked::before{opacity:.35}
.kind{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.kind.result{background:var(--run-soft);color:var(--run)}
.kind.decision{background:var(--warn-soft);color:var(--warn)}
.kind.note{background:var(--surface-2);color:var(--ink-2)}
.stale{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600;background:var(--bad-soft);color:var(--bad)}
.stale::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.layer{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 6px;border-radius:4px;line-height:17px}
.layer.det{color:var(--det);background:var(--det-soft)} .layer.lrn{color:var(--lrn);background:var(--lrn-soft)} .layer.mix{color:var(--ink-2);background:var(--surface-2)} .layer.io{color:var(--io);background:var(--io-soft)}

/* ---------- chips (edges) ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;padding:0 6px;border-radius:4px;font-family:var(--mono);font-size:11.5px;font-weight:500;line-height:18px;color:var(--accent);background:var(--accent-soft);border:1px solid transparent;cursor:pointer;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.ref{color:var(--det);background:var(--det-soft)}
.chip.ref.lrn{color:var(--lrn);background:var(--lrn-soft)}
.chip.logc{color:var(--ink-2);background:var(--surface-2)}
.chip:hover{border-color:var(--accent-line)}
.chip.hi{border-color:var(--accent)}
.verb{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.edgeline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:5px;font-size:12.5px;color:var(--ink-3)}

/* ---------- route tab ---------- */
.plantab{flex:1 1 auto;min-height:0;overflow:auto;padding:16px 20px 40px}
.sec{margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sechead{display:flex;align-items:baseline;gap:10px;padding:12px 18px;cursor:pointer;user-select:none}
.sechead .chev{font-size:13px;color:var(--ink-3);width:12px}
.sechead h2{font-family:var(--display);font-size:22px;font-weight:500}
.sechead .secsub{font-size:13px;color:var(--ink-3)}
.secbody{padding:2px 18px 18px}
.thesis{font-family:var(--display);font-size:17.5px;line-height:1.45;max-width:66ch;margin:2px 0 12px;color:var(--ink)}
.mapscroll.tight svg{min-width:640px;margin:0 auto}
.secbody .deep{margin:14px 0 0}
.secbody .panel{margin:14px 0 0;max-width:none}
.actgroups{display:grid;gap:14px}
.actgroup h4{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.actgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.actcard{padding:9px 11px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);cursor:pointer;display:grid;gap:3px}
.actcard.st-running{border-color:var(--run);background:var(--run-soft)}
.actcard.st-done{border-color:var(--ok);background:var(--ok-soft)}
.actcard.st-parked{border-style:dashed}
.actcard.open,.actcard.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.actcard.lit{border-color:var(--accent)}
.actcard .ac-head{display:flex;justify-content:space-between;align-items:baseline}
.actcard .ac-name{font-weight:600;font-size:14px;line-height:1.3}
.actcard .edgeline{margin-top:2px}
.deep .dline{font-size:15px;color:var(--ink-2);margin-top:6px}
svg .box.add rect{fill:var(--surface);stroke:var(--line);stroke-dasharray:4 3}
svg .box.add:hover rect{stroke:var(--ink)}
svg .box.add .plus{font-size:22px;fill:var(--ink-3)}
.addform{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;gap:10px;max-width:720px}
.addform h4{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.addform .tools{display:flex;gap:8px}
.addform .checks{display:grid;gap:6px}
.status-sel{width:auto;font-size:13px;padding:3px 8px;border-radius:999px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.panel .foot .tools-inline{display:inline-flex;gap:8px;align-items:center}
.panel .foot .tools-inline .btn{padding:3px 9px;font-size:12.5px}
.panel .inside{padding:0 26px 12px}
.panel .inside.top{padding:6px 26px 0}
.secbody .panel .deep{margin:14px 26px 0}
.panel .mini svg{margin:0 auto}
.iconbtn{font-size:16px;color:var(--ink-3);padding:0 4px;vertical-align:middle}
.iconbtn:hover{color:var(--ink)}
.hatp{position:relative;display:inline-block;font-style:italic;padding-right:.05em}
.hatp i{position:absolute;left:.22em;top:-.6em;font-size:.85em;font-style:normal}
.panel h2 .src{font-size:13px;font-family:var(--body)}
.deep .mini{margin:10px 0 0}
.deep .actgrid{margin-top:10px}
.deep > .tools{margin-top:12px}
.ol{list-style:disc;padding-left:22px;display:grid;gap:4px;font-size:15px;line-height:1.45}
.ol .ol{margin-top:4px;list-style:circle;font-size:14.5px;color:var(--ink-2)}
.ol .ol .ol{list-style:square}
.obox .tools{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--ink-3)}
textarea.outline{font-family:var(--mono);font-size:13px;line-height:1.5;min-height:150px;white-space:pre;tab-size:2}
.deep .obox{margin-top:8px}
.fields{display:grid;gap:10px;padding:8px 26px 4px}
.field-row{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:baseline}
.field-row h4{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
.field-row .ol{font-size:14.5px}
.lede .ol{font-family:var(--display);font-size:16px;color:var(--ink-2)}
@media (max-width:640px){ .field-row{grid-template-columns:1fr} .fields{padding:8px 16px 4px} }
.routemain{max-width:1160px;margin:0 auto}
.routemain.narrow{max-width:820px}
.routemain.logs{max-width:1240px;display:grid;grid-template-columns:292px minmax(0,1fr);gap:22px;align-items:start}
.calside{position:sticky;top:0;display:grid;gap:8px}
.calside .calhead{margin:0;gap:6px}
.calside .calhead h3{flex:1;min-width:0;font-size:18px;text-align:center}
.calside .cal{padding:8px}
.calside .cal .dow,.calside .cal .grid{gap:3px}
.calside .cal .dow{font-size:10.5px;padding-bottom:4px}
.calside .day{min-height:36px;padding:3px 2px;align-items:center;justify-content:center;gap:2px;border-radius:7px;border-color:transparent;background:transparent}
.calside .day:hover{border-color:var(--ink-3)}
.calside .day.has-note{background:var(--accent-soft);border-color:var(--accent-line)}
.calside .day.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface)}
.calside .day .dn{font-size:12.5px;color:var(--ink-2)}
.calside .day.today .dn{padding:0 5px}
.calside .day .dots{margin-top:0;gap:2px;height:5px}
.calside .day .dot{width:5px;height:5px}
.calfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;padding:0 2px}
#panel-logs .panel{max-width:none;margin:0}
#panel-logs .panel h2{gap:10px}
.todaytag{font-family:var(--body);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
.daynav{margin-left:auto;display:inline-flex;gap:6px;align-items:center}
.daynav .btn{padding:4px 9px;font-size:13px}
.dayempty{margin:60px auto;text-align:center;color:var(--ink-3);display:grid;gap:10px;justify-items:center}
@media (max-width:980px){ .routemain.logs{grid-template-columns:1fr} .calside{position:static} }
.calhead{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.calhead h3{font-family:var(--display);font-size:22px;font-weight:500;min-width:190px}
.calhead .faint{margin-left:auto;font-size:12.5px}
.cal{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px}
.cal .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 0 6px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:center}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{position:relative;min-height:84px;padding:6px 8px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:border-color .12s ease}
.day.blank{background:transparent;border-color:transparent;cursor:default}
.day:hover{border-color:var(--ink-3)}
.day .dn{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.day.today .dn{color:var(--on-accent);background:var(--accent);border-radius:999px;padding:0 6px;display:inline-block;width:max-content}
.day.has-note{background:var(--accent-soft);border-color:var(--accent-line)}
.day.future{opacity:.7}
.day .ex{font-size:12.5px;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.day .dots{display:flex;gap:3px;margin-top:auto}
.day .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.day .dot.result{background:var(--run)} .day .dot.decision{background:var(--warn)} .day .dot.note{background:var(--ink-3)}
.day.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.daynote{padding:2px 26px 0}
.dsec{margin-top:12px}
.dsec-head{display:flex;align-items:baseline;gap:12px;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.dsec-head .link{margin-left:auto;font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none}
.dsec-head .link.dim{color:var(--ink-3)} .dsec-head .link.dim:hover{color:var(--bad)}
.dsec-head .link + .link{margin-left:0}
.dsec textarea{margin-top:6px}
.dsec .notebody{margin-top:6px}
.dsec.empty .dsec-head{opacity:.7}
.dsec[data-sec="goals"] .notebody .md,.dsec[data-sec="review"] .notebody .md{font-size:15.5px}
.daytools{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.daynote textarea{min-height:110px;font-size:15.5px;line-height:1.6;padding:14px 16px;resize:none;overflow:hidden;border-radius:10px;font-family:var(--body)}
.daynote textarea:focus{border-color:var(--accent)}
.notebody{font-family:var(--display);font-size:16.5px;line-height:1.55;max-width:72ch}
.notebody .md{font-size:16.5px}
.notebody .md > * + *{margin-top:9px}
.md{font-size:14.5px;line-height:1.5}
.md > * + *{margin-top:6px}
.md p{margin:0}
.md h1,.md h2,.md h3{font-family:var(--display);font-weight:600;line-height:1.25}
.md > h1:not(:first-child),.md > h2:not(:first-child),.md > h3:not(:first-child){margin-top:12px}
.md h1{font-size:1.3em} .md h2{font-size:1.15em} .md h3{font-size:1.05em}
.md ul{list-style:disc;padding-left:22px;display:grid;gap:2px}
.md ol{list-style:decimal;padding-left:26px;display:grid;gap:2px}
.md li > ul,.md li > ol{margin-top:2px}
.md li.task{list-style:none;margin-left:-20px}
.md li.task label{display:inline-flex;gap:7px;align-items:baseline;cursor:pointer}
.md li.task input{width:auto;margin:0;vertical-align:-1px}
.md li.task input:checked + span{color:var(--ink-3);text-decoration:line-through}
.md code{font-family:var(--mono);font-size:.85em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.md pre{font-family:var(--mono);font-size:.85em;background:var(--surface-2);padding:8px 10px;border-radius:8px;overflow-x:auto;white-space:pre}
.md pre code{background:none;padding:0}
.md blockquote{border-left:3px solid var(--line);padding-left:10px;color:var(--ink-2)}
.md hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.md a{color:var(--accent)}
.md b{font-weight:600}
.md .tbl{overflow-x:auto;margin:6px 0;max-width:100%}
.md table{border-collapse:collapse;font-family:var(--body);font-size:13.5px;line-height:1.35;font-variant-numeric:tabular-nums}
.md th,.md td{border:1px solid var(--line);padding:4px 9px;vertical-align:top;white-space:nowrap}
.md th{background:var(--surface-2);font-weight:600;text-align:left}
.md tbody tr:nth-child(even) td{background:var(--surface)}
.md img.mdimg{display:block;max-width:100%;max-height:440px;margin:6px 0;border-radius:8px;border:1px solid var(--line-2);background:var(--surface-2);cursor:zoom-in}
.md img.mdimg:not([src]){min-height:64px;min-width:160px;font-size:12px;color:var(--ink-3);padding:8px;cursor:default}
.md img.mdimg.missing{cursor:pointer;border-style:dashed}
#lightbox{position:fixed;inset:0;background:rgba(15,16,28,.86);z-index:40;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:24px}
#lightbox img{max-width:100%;max-height:100%;border-radius:6px;box-shadow:var(--shadow)}
.daynote .tools code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:0 4px;border-radius:3px}
.daynote .tools{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12.5px;flex-wrap:wrap}
.daynote .tools .btn{white-space:nowrap}
.notestatus{font-size:12.5px;font-weight:600;color:var(--warn);white-space:nowrap}
.notestatus:empty{display:none}
.daynote .tools .faint{flex:1 1 260px;line-height:1.4}
.filters{display:flex;gap:6px;margin-bottom:10px}
.fbtn{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2)}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fbtn .n{font-family:var(--mono);font-size:11px;opacity:.75}
.log.wide{margin-top:8px}
.panel.wide{max-width:none}
.panel .bp{padding:0 0 8px}
.panel .bp .modelin{padding:0 26px}
.panel .bp .lede{margin-top:14px}
.caption .edges{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.caption .grp{display:inline-flex;align-items:center;gap:5px}
.col{display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.colhead{display:flex;align-items:baseline;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2);background:var(--surface)}
.colhead h2{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.colhead .hint{color:var(--ink-3);font-style:italic;font-family:var(--display);font-size:14px}
.colhead .count{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.colbody{overflow:auto;padding:12px 14px 20px;min-height:0;flex:1 1 auto}
@media (min-width:1000px){ .app{height:100vh;min-height:0} .main{overflow:hidden} }
@media (max-width:999px){ .top{flex-wrap:wrap;gap:10px 16px} .top h1{white-space:normal} }

/* selection: nodes light up, the rest recedes */
.node{transition:opacity .15s ease, box-shadow .15s ease, background .15s ease}
.has-sel .log .entry:not(.lit):not(.sel):not(:has(.hi)){opacity:.5}
.has-sel svg .box:not(.lit):not(.sel):not(.open){opacity:.5}
.entry.lit{box-shadow:inset 0 0 0 1.5px var(--accent-line)}
.entry.sel{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
svg .box.lit rect{stroke:var(--accent);stroke-width:2.5}
svg .box.sel rect{stroke:var(--ink);stroke-width:2.5}
.node[data-id]{cursor:pointer}
@media (prefers-reduced-motion: reduce){ .node{transition:none} html{scroll-behavior:auto} }

/* stage / unknown / activity boxes on the route maps */
svg .box .t2{font-size:13px;font-weight:600;fill:var(--ink)}
svg .box.stage rect{fill:var(--surface-2);stroke:var(--line)}
svg .box.stage.st-done rect{fill:var(--ok-soft);stroke:var(--ok)}
svg .box.stage.st-active rect{fill:var(--run-soft);stroke:var(--run)}
svg .box.stage.st-blocked rect{fill:var(--bad-soft);stroke:var(--bad)}
svg .box.unk rect{fill:var(--accent-soft);stroke:var(--accent-line)}
svg .box.unk.st-resolved rect{fill:var(--ok-soft);stroke:var(--ok)}
svg .box.unk.st-reshaped rect{fill:var(--warn-soft);stroke:var(--warn)}
svg .box.act rect{fill:var(--surface-2);stroke:var(--line)}
svg .box.act.st-running rect{fill:var(--run-soft);stroke:var(--run)}
svg .box.act.st-done rect{fill:var(--ok-soft);stroke:var(--ok)}
svg .box.act.st-parked rect{stroke-dasharray:4 3}
svg .box.vis rect{fill:var(--accent-soft);stroke:var(--accent-line)}
svg .box.vis .t{fill:var(--accent)}
svg .edge.rail{stroke:var(--accent-line);stroke-width:1.6}
svg .badge.open rect{fill:var(--accent-soft);stroke:var(--accent)} svg .badge.open text{fill:var(--accent)}
svg .badge.warn rect{fill:var(--warn-soft);stroke:var(--warn)} svg .badge.warn text{fill:var(--warn)}
.sw.stat{border-radius:3px} .sw.stat.done{background:var(--ok-soft);border-color:var(--ok)} .sw.stat.active{background:var(--run-soft);border-color:var(--run)} .sw.stat.blocked{background:var(--bad-soft);border-color:var(--bad)} .sw.stat.planned{background:var(--surface-2);border-color:var(--line)}
.sw.open{border-radius:999px;background:var(--accent-soft);border-color:var(--accent)}
.sw.warn{border-radius:999px;background:var(--warn-soft);border-color:var(--warn)}
.flag{display:flex;align-items:center;gap:10px;margin-top:10px;padding:7px 10px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:500}
.flag b{font-weight:700}
.flag button{margin-left:auto;font-weight:700;text-decoration:underline;white-space:nowrap}
.deep .body .q{font-family:var(--display);font-size:17px}
.deep .body h4{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:12px;margin-bottom:4px}
.deep .edges{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line-2)}
.deep .edges .grp{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
.deep .tools .btn + .btn{margin-left:6px}
.panel .foot .grp{display:inline-flex;gap:16px}

/* log */
.log{display:grid;gap:8px}
.entry{padding:9px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface)}
.entry-head{display:flex;align-items:center;gap:8px}
.entry-head .date{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-left:auto}
.entry .text{margin-top:5px;font-size:14px}
.entry .edgeline{margin-top:6px}
.entry .entry-foot{margin-top:6px;display:flex;justify-content:flex-end;font-size:12px;color:var(--ink-3)}
.entry .etools{display:inline-flex;gap:10px;align-items:center}
.entry .etools > button:not(.btn){color:var(--ink-3)} .entry .etools > button:not(.btn):hover{color:var(--ink)}
.entry.editing textarea{margin-top:6px;font-size:14px;min-height:70px}
.entry.editing input[type=date]{margin-left:auto;width:auto;font:inherit;font-size:12.5px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.entry.editing .tools{display:flex;gap:8px;margin-top:8px}

/* ---------- state cards ---------- */
.state{margin:40px auto;max-width:520px;padding:24px 26px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:center}
.state h2{font-family:var(--display);font-weight:500;font-size:22px;margin-bottom:6px}
.state p{color:var(--ink-2)}

/* ---------- model view ---------- */
.modelin{max-width:1160px;margin:0 auto}
.modelin .lede{max-width:760px;font-family:var(--display);font-size:17.5px;line-height:1.45;color:var(--ink-2)}
.modelin .how{margin-top:8px;font-size:13.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 16px}
.modelin .how b{color:var(--ink-2)}
.mapsec{margin-top:22px}
.maphead{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
.maphead h2{font-family:var(--display);font-size:22px;font-weight:500}
.maphead .sub{font-size:13px;color:var(--ink-3)}
.mapscroll{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:6px 4px}
.mapscroll svg{display:block;min-width:900px;width:100%;height:auto;font-family:var(--body)}
svg .box rect{fill:var(--bg);stroke:var(--line);stroke-width:1.5;transition:stroke .15s ease}
svg .box.det rect{stroke:var(--det-line);fill:var(--det-soft)}
svg .box.lrn rect{stroke:var(--lrn-line);fill:var(--lrn-soft)}
svg .box.mix rect{stroke:url(#mixstroke);stroke-width:2;fill:var(--surface)}
svg .box.data rect{stroke:var(--io);fill:var(--surface)}
svg .box.io circle{fill:var(--io-soft);stroke:var(--io);stroke-width:1.5}
svg .box .n{font-size:10.5px;fill:var(--ink-3);font-family:var(--mono)}
svg .box .sym{font-size:24px;font-weight:500;fill:var(--ink);font-family:var(--display);font-style:italic}
svg .box .more{font-size:11px;fill:var(--accent);font-weight:600}
svg .box.open rect,svg .box.open circle{stroke:var(--ink);stroke-width:2.5}
svg .box.open.data rect{fill:var(--accent-soft)}
.panel .mini{margin:12px 26px 0;overflow-x:auto;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2);padding:4px}
.panel .mini svg{display:block;width:100%;height:auto;font-family:var(--body)}
.panel .caption{margin:10px 26px 0;min-height:44px}
.sw.data{border-radius:999px;background:var(--surface);border-color:var(--io)}
.layer.data{color:var(--io);background:var(--io-soft)}
svg .box{cursor:pointer}
svg .box .t{font-size:14.5px;font-weight:600;fill:var(--ink)}
svg .box .s{font-size:11.5px;fill:var(--ink-2)}
svg .box .io-t{font-size:20px;font-weight:500;fill:var(--ink);font-family:var(--display);font-style:italic}
svg .box .io-s{font-size:11px;fill:var(--ink-3)}
svg .box.det .t{fill:var(--det)} svg .box.lrn .t{fill:var(--lrn)}
:root[data-theme="dark"] svg .box.det .t, :root[data-theme="dark"] svg .box.lrn .t{fill:var(--ink)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) svg .box.det .t, :root:not([data-theme="light"]) svg .box.lrn .t{fill:var(--ink)} }
svg .box.sel rect,svg .box.sel circle{stroke:var(--ink);stroke-width:2.5}
svg .box.open rect{stroke:var(--ink);stroke-width:2.5}
svg .box:hover rect,svg .box:hover circle{stroke:var(--ink)}
svg.dim .box:not(.open):not(.sel){opacity:.55}
svg .edge{fill:none;stroke:var(--ink-3);stroke-width:1.6}
svg .edge.lit{stroke:var(--ink);stroke-width:2}
svg .arrow{fill:var(--ink-3)} svg .edge.lit + .arrow{fill:var(--ink)}
svg .lab{font-size:11.5px;fill:var(--ink-2)}
svg .lab tspan.m{font-family:var(--display);font-style:italic;font-size:12.5px}
svg .junction{fill:var(--ink-3)}
svg .badge rect{fill:var(--surface);stroke:var(--line);stroke-width:1}
svg .badge text{font-size:10.5px;font-weight:600;fill:var(--ink-2);font-family:var(--body)}
svg .badge.acts rect{fill:var(--run-soft);stroke:var(--run)} svg .badge.acts text{fill:var(--run)}
svg .badge.stale rect{fill:var(--bad-soft);stroke:var(--bad)} svg .badge.stale text{fill:var(--bad)}
svg.static{pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:13px;height:13px;border-radius:3px;border:1.5px solid}
.sw.det{background:var(--det-soft);border-color:var(--det-line)} .sw.lrn{background:var(--lrn-soft);border-color:var(--lrn-line)}
.sw.mix{background:linear-gradient(90deg,var(--det-soft),var(--lrn-soft));border-color:var(--ink-3)}
.sw.io{border-radius:50%;background:var(--io-soft);border-color:var(--io)}
.sw.acts{background:var(--run-soft);border-color:var(--run);border-radius:999px}
.sw.stale{background:var(--bad-soft);border-color:var(--bad);border-radius:999px}
.caption{margin-top:10px;min-height:50px;padding:10px 14px;border-radius:9px;background:var(--surface);border:1px solid var(--line-2);font-size:13.5px;color:var(--ink-2);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.caption .name{font-weight:600;color:var(--ink);font-size:14.5px}
.caption .role{flex:1 1 320px}
.caption .cta{color:var(--ink-3);white-space:nowrap}
.caption .cta button{font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.caption.empty{color:var(--ink-3);font-style:italic;font-family:var(--display);font-size:14.5px}
.panel{max-width:880px;margin:18px auto 0;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.panel > header{padding:20px 26px 6px}
.crumbs{font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.crumbs .cur{color:var(--ink-2);font-weight:600}
.panel h2{font-family:var(--display);font-size:28px;line-height:1.1;font-weight:500;margin-top:6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.panel .role{margin-top:10px;font-size:16px;max-width:66ch}
.panel .io{margin-top:9px;font-size:13.5px;color:var(--ink-2);display:grid;grid-template-columns:auto 1fr;gap:3px 12px;max-width:66ch}
.panel .io b{font-weight:600;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;font-size:11px}
.panel .eq{margin:12px 26px 0;padding:12px 16px;border-radius:9px;background:var(--surface-2);overflow-x:auto;font-size:16px}
.panel .eq mjx-container{margin:4px 0!important}
.panel .note{margin:12px 26px 0;padding:9px 13px;border-left:3px solid var(--lrn-line);background:var(--lrn-soft);font-size:13px;color:var(--ink-2);border-radius:0 8px 8px 0}
.panel .note b{color:var(--lrn)}
.panel .usage{margin:12px 26px 0;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--ink-3)}
.panel .usage .verb{color:var(--ink-3)}
.inside{padding:16px 26px 20px}
.inside .label{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.inside .label span:last-child{font-weight:400;letter-spacing:0;text-transform:none;font-size:12.5px}
.steps{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px 0;margin-top:10px}
.step{flex:1 1 150px;min-width:150px;max-width:230px;padding:9px 11px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface-2);font-size:12.5px;line-height:1.35;color:var(--ink-2);display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-content:start;position:relative}
.step .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding-top:2px}
.step b{color:var(--ink);font-weight:600;font-size:13.5px}
.step .d{grid-column:2}
.step .upd{grid-column:2;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:2px}
.step.more{cursor:pointer;padding-bottom:24px}
.step.more::after{content:"▸ more";position:absolute;right:9px;bottom:6px;font-size:11px;color:var(--accent);font-weight:600}
.step.more:hover{border-color:var(--ink-3)}
.step.open{border-color:var(--ink);background:var(--surface)}
.step.open::after{content:"▾ open";color:var(--ink)}
.step.det{border-color:var(--det-line)} .step.lrn{border-color:var(--lrn-line)}
.step.det.open,.step.lrn.open{border-color:var(--ink)}
.stepsep{flex:0 0 auto;align-self:center;padding:0 5px;color:var(--ink-3);font-size:15px}
.deep{margin:14px 26px 0;padding:16px 20px 18px;border-radius:10px;border:1.5px solid var(--ink);background:var(--surface)}
.deep header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.deep h3{font-family:var(--display);font-size:21px;font-weight:500}
.deep .src{font-size:12px;color:var(--ink-3)}
.deep .close{margin-left:auto;font-size:13px;color:var(--ink-3)}
.deep .body{margin-top:8px;font-size:15.5px;max-width:68ch;font-family:var(--display);line-height:1.5}
.deep .body p + p{margin-top:8px}
.deep .body ul{list-style:disc;padding-left:22px;margin-top:6px;display:grid;gap:3px}
.deep .body ol{list-style:lower-roman;padding-left:26px;margin-top:6px;display:grid;gap:3px}
.deep .body li ul{margin-top:3px;list-style:"– ";padding-left:18px}
.deep .body .tex-block{margin:10px 0;padding:8px 12px;border-radius:8px;background:var(--surface-2);overflow-x:auto}
.deep .tools{display:flex;gap:8px;margin-top:12px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.deep textarea{margin-top:8px;font-family:var(--mono);font-size:12.5px;min-height:180px}
.panel .foot{display:flex;justify-content:space-between;align-items:center;padding:10px 26px 13px;margin-top:14px;border-top:1px solid var(--line-2);font-size:13px;color:var(--ink-3)}
.panel .foot button{color:var(--accent);font-weight:600}
.modelin .why{max-width:760px;margin:40px auto 0}
.modelin .why h2{font-family:var(--display);font-size:22px;font-weight:500;margin-bottom:8px}
.modelin .why p{font-family:var(--display);font-size:16.5px;line-height:1.5;color:var(--ink-2);max-width:64ch}

/* ---------- modal ---------- */
.back{position:fixed;inset:0;background:rgba(15,16,28,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto;z-index:20}
.modal{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:20px 22px 18px;display:grid;gap:14px}
.modal h3{font-family:var(--display);font-weight:500;font-size:22px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg label{padding:6px 14px;border-radius:6px;font-weight:500;color:var(--ink-2);cursor:pointer}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg input{position:absolute;opacity:0;width:0;height:0}
.field{display:grid;gap:5px}
.field > span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.propagate{padding:12px 14px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--accent-line);display:grid;gap:8px}
.propagate p{font-size:14px}
.propagate .opts{display:grid;gap:6px}
.propagate label{display:flex;align-items:center;gap:8px;font-size:14px}
.propagate label input[type=text]{flex:1}
.propagate .arrow{font-family:var(--mono);color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal details{border:1px solid var(--line-2);border-radius:8px;padding:8px 12px}
.modal summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2)}
.modal details .inner{display:grid;gap:10px;margin-top:10px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;margin-top:2px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:auto}

.toast{position:fixed;right:18px;bottom:56px;padding:9px 14px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:13.5px;box-shadow:var(--shadow);z-index:30}
.inline-confirm{display:inline-flex;gap:8px;align-items:center}

/* ---------- site: gate, sync, comments ---------- */
input[type=password]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
.gate{margin:10vh auto 40px;max-width:420px;padding:26px 28px 24px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:grid;gap:12px}
.gate.wide{max-width:560px}
.gate h2{font-family:var(--display);font-weight:500;font-size:26px;margin-top:2px}
.gate p{color:var(--ink-2);font-size:14.5px}
.gate .err{color:var(--bad);font-size:13.5px}
.gate footer{display:flex;justify-content:flex-end;gap:8px}
.gate code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.gate ol{list-style:decimal;padding-left:20px;display:grid;gap:5px;font-size:14px;color:var(--ink-2)}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.busy i{background:var(--warn)} .sync.bad i{background:var(--bad)}
.foot button.link,.link{color:var(--accent);font-weight:600}
.cmts{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.cmts h4{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:10px;align-items:baseline}
.cmts h4 button{font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--accent)}
.cmts ul{display:grid;gap:6px;margin-top:8px}
.cmt{padding:8px 11px 9px;border-radius:8px;background:var(--surface-2)}
.cmt.resolved{opacity:.55}
.cmt-head{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap}
.cmt-head b{color:var(--ink);font-weight:600}
.cmt-tools{margin-left:auto;display:inline-flex;gap:10px}
.cmt-tools button{font-size:12px;color:var(--ink-3)} .cmt-tools button:hover{color:var(--ink)}
.cmt p{margin-top:3px;font-size:14.5px;white-space:pre-wrap;color:var(--ink)}
.cmtform{margin-top:8px;display:grid;gap:6px}
.cmtform textarea{min-height:54px;font-size:14px}
.cmtform .row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.cmtform .row2 input{width:170px;padding:4px 8px;font-size:13px}
.cmtform .row2 .btn{margin-left:auto}
.cbadge circle{fill:var(--accent)} .cbadge text{fill:var(--on-accent);font-size:10.5px;font-weight:700;font-family:var(--body)}
.cpill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:999px;padding:0 6px;line-height:16px;margin-left:6px;font-family:var(--body)}
.day .dot.cdot{background:var(--accent)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:25;overflow:auto;padding:18px 22px 30px;display:grid;gap:16px;align-content:start}
.drawer header{display:flex;align-items:baseline;gap:12px}
.drawer h2{font-family:var(--display);font-size:24px;font-weight:500}
.drawer header .close{margin-left:auto;font-size:13px;color:var(--ink-3)}
.drawer .thread{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px 12px;background:var(--bg)}
.drawer .thread h3{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.drawer .thread h3 .faint{font-weight:400}
.drawer .thread h3 button{color:var(--accent);font-weight:600;font-size:14px;text-align:left}
.drawer .thread .cmts{margin-top:2px;padding-top:0;border-top:0}
.drawer .thread .cmts h4{display:none}
mark.hl{background:var(--accent-soft);color:inherit;border-bottom:2px solid var(--accent-line);padding:0 1px;border-radius:2px;cursor:pointer}
mark.hl:hover{background:var(--accent-line)}
.cquote{display:block;text-align:left;font:inherit;font-size:12.5px;line-height:1.35;color:var(--ink-2);border-left:3px solid var(--accent-line);background:var(--accent-soft);padding:3px 8px;margin:6px 0 2px;border-radius:0 6px 6px 0;cursor:pointer;max-width:100%}
.cquote:hover{color:var(--ink)}
.cquote.pending{display:flex;gap:8px;align-items:center;cursor:default;margin:0}
.cquote.pending span{flex:1}
.cquote.pending button{font-size:15px;line-height:1;color:var(--ink-3)} .cquote.pending button:hover{color:var(--ink)}
#selbtn{position:fixed;z-index:26;padding:6px 12px;border-radius:7px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;box-shadow:var(--shadow)}
#selbtn::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}
.flash{animation:rbflash 1.4s ease-out}
@keyframes rbflash{0%{background:var(--warn-soft);box-shadow:0 0 0 3px var(--warn-soft)}100%{}}
.cmt.flash{background:var(--warn-soft)}

/* =====================================================================
   Routebook, second edition: a research notebook on a desk.
   Desk: pale sage with a faint graph-paper grid. Pages: white paper.
   Ink: blue-black text, ballpoint-blue accent, highlighter yellow for
   what needs a second look (today, anchored comments).
   Type: Literata for reading and writing, Atkinson Hyperlegible Next for
   the interface, IBM Plex Mono only for page numbers and IDs.
   ===================================================================== */
:root{
  --bg:#ECEFEA; --surface:#FFFFFF; --surface-2:#F3F6F2; --surface-3:#E7ECE6;
  --ink:#1C2826; --ink-2:#465451; --ink-3:#6F7D79;
  --line:#D2DAD4; --line-2:#E3E9E4;
  --accent:#2A55A0; --accent-ink:#1E4180; --accent-soft:#E7EEF9; --accent-line:#B3C5E5; --on-accent:#FFFFFF;
  --hl:#F4D65E; --hl-soft:#FBEFB8; --on-hl:#1C2826;
  --ok:#2E7A4D; --ok-soft:#E1F0E6;
  --warn:#96600F; --warn-soft:#F7ECD5;
  --bad:#AF3D2D; --bad-soft:#F7E2DD;
  --run:#1D7580; --run-soft:#DDEFF0;
  --grid:rgba(52,104,84,.07);
  --shadow:0 1px 2px rgba(28,40,38,.05), 0 10px 28px -10px rgba(28,40,38,.16);
  --paper:0 1px 0 rgba(28,40,38,.04), 0 12px 32px -14px rgba(28,40,38,.2);
  --display:'Literata', 'Iowan Old Style', Georgia, serif;
  --read:'Literata', 'Iowan Old Style', Georgia, serif;
  --body:'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --mono:'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace;
  --sheet-pad:44px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121715; --surface:#1B2120; --surface-2:#222A28; --surface-3:#2B3431;
    --ink:#E3EAE7; --ink-2:#AEBBB7; --ink-3:#83918D;
    --line:#303B38; --line-2:#28312F;
    --accent:#93B3F0; --accent-ink:#B7CCF6; --accent-soft:#1F2A40; --accent-line:#415D90; --on-accent:#0E1A2E;
    --hl:#D9BC4C; --hl-soft:#3A351F; --on-hl:#1B1705;
    --ok:#6CC08E; --ok-soft:#183424;
    --warn:#E3A95A; --warn-soft:#3A2C16;
    --bad:#EC7A66; --bad-soft:#3E211B;
    --run:#62C3CE; --run-soft:#173237;
    --grid:rgba(170,210,190,.045);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -10px rgba(0,0,0,.5);
    --paper:0 1px 0 rgba(0,0,0,.25), 0 14px 36px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121715; --surface:#1B2120; --surface-2:#222A28; --surface-3:#2B3431;
  --ink:#E3EAE7; --ink-2:#AEBBB7; --ink-3:#83918D;
  --line:#303B38; --line-2:#28312F;
  --accent:#93B3F0; --accent-ink:#B7CCF6; --accent-soft:#1F2A40; --accent-line:#415D90; --on-accent:#0E1A2E;
  --hl:#D9BC4C; --hl-soft:#3A351F; --on-hl:#1B1705;
  --ok:#6CC08E; --ok-soft:#183424;
  --warn:#E3A95A; --warn-soft:#3A2C16;
  --bad:#EC7A66; --bad-soft:#3E211B;
  --run:#62C3CE; --run-soft:#173237;
  --grid:rgba(170,210,190,.045);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -10px rgba(0,0,0,.5);
  --paper:0 1px 0 rgba(0,0,0,.25), 0 14px 36px -14px rgba(0,0,0,.6);
}

/* ---------- ground ---------- */
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px);background-size:24px 24px;background-attachment:fixed;font-family:var(--body);font-size:15px;line-height:1.5;color:var(--ink)}
::selection{background:var(--accent-soft)}
input[type=checkbox]{accent-color:var(--accent)}
select,textarea,input[type=text],input[type=password],input[type=date]{border-color:var(--line);border-radius:8px;background:var(--surface)}
select:focus,textarea:focus,input:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
::placeholder{color:var(--ink-3);opacity:1}

/* ---------- header ---------- */
.top{gap:18px;padding:10px 22px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto;margin:0;font:inherit;white-space:nowrap;overflow:hidden}
.brand .mark{width:26px;height:26px;color:var(--accent);flex:0 0 auto}
.brand .bname{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.brand .bfull{font-family:var(--display);font-size:16px;font-weight:400;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;min-width:0}
.tabs{background:transparent;padding:0;gap:2px;border-radius:0}
.tabs button{padding:7px 13px;border-radius:8px;font-size:15px;font-weight:600;color:var(--ink-2);transition:background .12s ease,color .12s ease}
.tabs button:hover{background:var(--surface-2);color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-ink);box-shadow:none}
.topacts{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.btn{border-radius:8px;border-color:var(--line);transition:background .12s ease,border-color .12s ease,color .12s ease}
.btn:hover{border-color:var(--ink-3)}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost:hover{background:var(--accent-soft);border-color:transparent}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-3);font-weight:500;padding-left:0}
.btn.quiet:hover{color:var(--accent)}
.cmtbtn .cpill{margin-left:2px}
@media (max-width:999px){ .top{flex-wrap:wrap} }
@media (max-width:760px){
  .top{padding:8px 14px 0;gap:6px 10px}
  .brand .bfull{display:none}
  .top .tabs{order:3;width:100%;border-top:1px solid var(--line-2);padding:4px 0}
  .top .tabs button{flex:1;padding:8px 6px}
  .btn.logbtn{display:none}
}

/* ---------- footer ---------- */
.foot{padding:6px 22px;gap:16px;font-size:12.5px;background:var(--surface);border-top:1px solid var(--line)}
.foot .spacer{flex:1}
.foot .link.quiet{color:var(--ink-3);font-weight:500}
.foot .link.quiet:hover{color:var(--accent)}
.sync{color:var(--ink-3)}

/* ---------- logs: calendar column ---------- */
.plantab{padding:22px 22px 0}
.routemain{padding-bottom:48px}
.routemain.logs{max-width:1140px;grid-template-columns:256px minmax(0,1fr);gap:30px}
.calside{gap:16px;top:0}
.caltoggle{display:none}
.calcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px 8px;box-shadow:0 1px 0 rgba(28,40,38,.03)}
.calside .calhead{display:flex;align-items:center;gap:4px;margin:0 0 6px}
.calside .calhead h3{flex:1;text-align:center;font-family:var(--display);font-size:17px;font-weight:600;min-width:0}
.navbtn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;font-size:20px;line-height:1;color:var(--ink-2);border:1px solid transparent}
.navbtn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line-2)}
.calside .cal{border:0;background:none;padding:0;border-radius:0}
.calside .cal .dow{gap:2px;padding:0 0 4px;font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink-3)}
.calside .cal .grid{gap:2px}
.calside .day{min-height:34px;padding:2px;border:0;border-radius:8px;background:transparent;gap:1px;align-items:center;justify-content:center}
.calside .day:hover{background:var(--surface-2)}
.calside .day .dn{font-family:var(--read);font-size:14px;font-variant-numeric:lining-nums tabular-nums;color:var(--ink-2);line-height:22px;min-width:24px;text-align:center;border-radius:999px}
.calside .cal .grid .day:nth-child(7n+6) .dn,.calside .cal .grid .day:nth-child(7n) .dn{color:var(--ink-3)}
.calside .day.has-note{background:var(--accent-soft)}
.calside .cal .grid .day.has-note .dn{color:var(--accent-ink);font-weight:700}
.calside .cal .grid .day.today .dn{background:var(--hl);color:var(--on-hl);font-weight:700;padding:0 5px}
.calside .day.future{opacity:1}
.calside .cal .grid .day.future:not(.today) .dn{color:var(--ink-3)}
.calside .day.sel{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--ink)}
.calside .day .dots{height:4px;margin:0;gap:2px}
.calside .day .dot{width:4px;height:4px}
.calfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px;padding:6px 2px 0;margin-top:6px;border-top:1px solid var(--line-2);font-size:12.5px}
.calfoot .btn.on{color:var(--ink-3);font-weight:500}
.recent h4{font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 4px 8px}
.recent ul{display:grid;gap:1px}
.pagelink{display:grid;gap:1px;width:100%;text-align:left;padding:6px 8px;border-radius:8px;border:1px solid transparent}
.pagelink:hover{background:var(--surface);border-color:var(--line-2)}
.pagelink.sel{background:var(--surface);border-color:var(--line)}
.pagelink .pd{font-size:12px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pagelink .px{font-family:var(--read);font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- logs: the page ---------- */
.sheet{position:relative;max-width:820px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--paper);padding:26px var(--sheet-pad) 30px}
.sheethead{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 16px;padding-bottom:16px;border-bottom:1px solid var(--line-2)}
.sheetmeta{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;min-width:0;font-size:12.5px;color:var(--ink-3)}
.pageno{font-family:var(--mono);font-size:12px;letter-spacing:.02em;word-spacing:-.3em;color:var(--ink-2)}
.sheetmeta .link{font-weight:500;color:var(--ink-3)}
.sheetmeta .link:hover{color:var(--accent)}
.daynav{display:inline-flex;align-items:center;gap:4px;margin:0}
.daynav .btn{padding:4px 10px;font-size:13px}
.sheetdate{grid-column:1 / -1;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:2px 0 0;font-family:var(--display);font-size:32px;font-weight:600;line-height:1.15;letter-spacing:-.015em;color:var(--ink)}
.sheetdate .yr{font-size:.6em;font-weight:400;color:var(--ink-3);letter-spacing:0}
.todaytag{align-self:center;font-family:var(--body);font-size:12.5px;font-weight:700;letter-spacing:.01em;text-transform:none;color:var(--on-hl);background:var(--hl);padding:2px 10px;border-radius:999px}

.daynote{padding:0}
.dsec{margin-top:24px}
.dsec-head{display:flex;align-items:baseline;gap:4px 14px;flex-wrap:wrap;font-size:14px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink-2)}
.dsec-head .label{font-family:var(--body);font-size:14px;font-weight:700;color:var(--ink-2)}
.dsec-head .link{margin-left:0;font-size:13px;font-weight:600;color:var(--ink-3)}
.dsec-head .link:hover{color:var(--accent)}
.dsec-head .link[data-action="goals-carry"]{color:var(--accent)}
.dsec .notebody{margin-top:8px}
.dsec.empty{margin-top:14px}
.addsec{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border:1px dashed var(--line);border-radius:8px;color:var(--ink-3);font-size:13.5px;font-weight:600}
.addsec .plus{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:var(--surface-2);font-size:15px;line-height:1}
.addsec:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.dsec[data-sec="review"]:not(.empty):not(.editing){margin-top:28px;padding:14px 18px 16px;background:var(--surface-2);border-radius:8px}

.notebody{font-family:var(--read);font-size:16.5px;line-height:1.62;max-width:68ch;color:var(--ink)}
.notebody .md{font-size:inherit;line-height:inherit}
.notebody .md > * + *{margin-top:10px}
.dsec[data-sec="goals"] .notebody,.dsec[data-sec="review"] .notebody{font-size:16px}
.dsec[data-sec="goals"] .notebody .md,.dsec[data-sec="review"] .notebody .md{font-size:inherit}
.md li::marker{color:var(--ink-3)}
.md ul,.md ol{gap:3px}
.md h1,.md h2,.md h3{font-family:var(--display);font-weight:650;letter-spacing:-.01em;color:var(--ink)}
.md li.task{margin-left:-22px}
.md li.task label{gap:9px}
.md li.task input{width:16px;height:16px;flex:0 0 auto;transform:translateY(2px)}
.md li.task input:checked + span{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.md code{background:var(--surface-2);border:1px solid var(--line-2)}
.md table{font-family:var(--body);font-size:13.5px}
.md th{background:var(--surface-2)}
.md th,.md td{border-color:var(--line)}
.md blockquote{border-left-color:var(--accent-line)}

.daynote textarea{display:block;width:100%;font-family:var(--read);font-size:16.5px;line-height:1.62;color:var(--ink);padding:12px 14px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;resize:none;overflow:hidden;margin-top:8px}
.daynote textarea:focus{background:var(--surface);border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.daynote textarea::placeholder{font-style:italic}

.daytools{position:sticky;bottom:0;z-index:3;display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:20px calc(-1 * var(--sheet-pad)) 0;padding:10px var(--sheet-pad);border-top:1px solid var(--line-2);background:var(--surface);font-size:12.5px}
.daytools .faint.autosave{flex:1 1 180px;text-align:right;line-height:1.3}
.notestatus{color:var(--warn)}
.mdhelp{position:relative}
.mdhelp summary{list-style:none;cursor:pointer;padding:5px 10px;border-radius:8px;border:1px solid transparent;color:var(--ink-2);font-size:13px;font-weight:600}
.mdhelp summary::-webkit-details-marker{display:none}
.mdhelp summary:hover,.mdhelp[open] summary{background:var(--surface-2);border-color:var(--line-2)}
.mdgrid{position:absolute;bottom:calc(100% + 8px);left:0;z-index:5;display:grid;grid-template-columns:auto auto;gap:6px 16px;align-items:baseline;width:max-content;max-width:min(420px, 80vw);padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);font-size:13px;color:var(--ink-2)}
.mdgrid code{font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--surface-2);padding:1px 6px;border-radius:4px;white-space:nowrap}

.planupd{margin-top:28px;padding-top:16px;border-top:1px dashed var(--line)}
.planupd h4{font-size:14px;font-weight:700;color:var(--ink-2);margin-bottom:8px}
.planupd .log{margin-bottom:10px}
.sheet .inside{padding:0}
.sheet .cmts{margin-top:18px;padding-top:16px}
.sheetnext{display:flex;justify-content:flex-end;margin-top:22px;font-size:13px}
.sheetnext .link{font-weight:600}
.dayempty{margin:80px auto;color:var(--ink-3)}

/* ---------- comments and highlights ---------- */
.cmts h4{font-size:14px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink-2)}
.cmts h4 .faint{font-weight:500}
.cmt{background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px}
.cmt p,.cmt .md{font-size:14.5px}
mark.hl{background:var(--hl-soft);border-bottom:2px solid var(--hl);color:inherit}
mark.hl:hover{background:var(--hl)}
.cquote{border-left-color:var(--hl);background:var(--hl-soft);color:var(--ink-2)}
.cpill{background:var(--accent);color:var(--on-accent)}
.drawer{background:var(--surface);border-left-color:var(--line)}
.drawer h2{font-family:var(--display);font-weight:600}
.drawer .thread{background:var(--bg);border-color:var(--line-2)}
#selbtn{background:var(--ink);color:var(--surface);border-radius:8px}

/* ---------- plan and artifacts ---------- */
.sec{border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:0 1px 0 rgba(28,40,38,.03);margin-bottom:16px}
.sechead{padding:14px 20px}
.sechead h2,.maphead h2{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:-.01em}
.secbody{padding:0 20px 20px}
.secbody > .mapscroll{border:0;background:transparent;padding:0}
.mapscroll{border-color:var(--line);border-radius:10px}
.actgroup h4,.inside .label,.addform h4,.deep .body h4{font-size:13px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink-2)}
.actcard{border-width:1px;border-radius:8px;background:var(--surface)}
.actcard:hover{border-color:var(--ink-3)}
.actcard .ac-name{font-size:14.5px}
svg .box .t2{font-size:14px}
svg .box.vis rect{fill:var(--surface-2);stroke:var(--line)}
svg .box.vis .t2{fill:var(--ink)}
svg .box.stage rect{fill:var(--surface)}
svg .box.stage:hover rect,svg .box.vis:hover rect{stroke:var(--ink-3)}
.panel{border-radius:10px;box-shadow:var(--shadow)}
.panel h2{font-weight:600;letter-spacing:-.01em}
.deep{border-width:1px;border-color:var(--line);border-radius:10px;background:var(--surface-2)}
.verb{letter-spacing:.03em}
.state,.gate{box-shadow:var(--paper);border-radius:10px}

/* ---------- plan: the stage page ---------- */
.secnote{margin:2px 0 10px;font-size:13px}
.secbody > .secnote:last-child{margin:10px 0 0}
svg .box.stage rect.seg{fill:var(--surface);stroke:var(--ink-3);stroke-width:1}
svg .box.stage rect.seg.pass{fill:var(--ok);stroke:var(--ok)}
svg .box.stage rect.seg.fail{fill:var(--bad);stroke:var(--bad)}
svg .box.stage rect.seg.mixed{fill:var(--warn);stroke:var(--warn)}
svg .box.stage .s.meter-t{font-size:12px;font-family:var(--read)}
svg .box .s,svg .box .n{font-variant-numeric:lining-nums}
svg .box.stage.open rect:not(.seg){stroke:var(--ink);stroke-width:2.5}
.stage-sheet{max-width:none;margin:0 0 16px;scroll-margin-top:12px}
.stage-sheet .sheethead{padding-bottom:18px}
.sttitle{grid-column:1 / -1;display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;margin:4px 0 0;font-family:var(--display);font-size:30px;font-weight:600;line-height:1.18;letter-spacing:-.015em;color:var(--ink)}
.sttitle .status-sel{font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:0}
.stage-sheet .addform{max-width:760px}
.ssec{margin-top:28px;scroll-margin-top:12px}
.ssec > .dsec-head{margin-bottom:6px}
.ssec .dsec-head .count{font-size:13px;font-weight:500;color:var(--ink-3)}
.ssec .dsec-head .link{margin-left:0}
.ssec > .faint{font-size:13.5px;margin-top:2px}
.notebody.crit{font-size:17px;line-height:1.55;max-width:72ch}
.mdf{margin-top:6px;max-width:860px}
.mdf textarea,.stage-sheet textarea.mdta{display:block;width:100%;font-family:var(--read);font-size:16px;line-height:1.55;color:var(--ink);padding:10px 12px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;resize:none;overflow:hidden}
.stage-sheet textarea.mdta:focus{background:var(--surface);border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.mdf .tools,.terow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;font-size:12.5px}
.terow .spacer,.atools .spacer,.stfoot .spacer{flex:1}
.link.dim{color:var(--ink-3);font-weight:500}
.link.dim:hover{color:var(--accent)}
.link:disabled{opacity:.4;cursor:default}

/* success criteria: meter, judging rule, tasks */
.meter{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-top:14px;font-size:13.5px;color:var(--ink-2)}
.meter b{font-family:var(--read);font-weight:700;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.meter .bar{display:flex;gap:4px;min-width:0}
.meter .bar i{flex:0 1 22px;min-width:5px;width:22px;height:8px;border-radius:3px;background:var(--surface);border:1px solid var(--ink-3)}
.meter .bar i.pass{background:var(--ok);border-color:var(--ok)}
.meter .bar i.fail{background:var(--bad);border-color:var(--bad)}
.meter .bar i.mixed{background:var(--warn);border-color:var(--warn)}
.judged{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--hl-soft);font-size:13.5px;line-height:1.5;color:var(--ink-2);max-width:860px}
.judged b{color:var(--ink)}
.judged .link{font-weight:700}
.judged.set{background:var(--surface-2);border:1px solid var(--line-2)}
.judged.set .notebody{font-size:15px;margin-top:4px}
.judged.set .mdf{margin-top:4px}
.scorewrap{margin-top:14px;overflow-x:auto}
.score{width:100%;border-collapse:collapse;font-size:14px}
.score th,.score td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.score thead th{font-size:12.5px;font-weight:700;color:var(--ink-3);border-bottom:1px solid var(--line);padding-top:4px}
.score th.num,.score td.num{width:30px;padding-right:0;color:var(--ink-3);font-family:var(--read);font-variant-numeric:lining-nums tabular-nums}
.score tr.grp th{padding:16px 10px 6px;font-size:13.5px;font-weight:700;color:var(--ink-2);border-bottom:0}
.score tr.grp th span{font-weight:500;color:var(--ink-3);margin-left:8px}
.score td.tname{font-family:var(--read);font-size:15.5px;line-height:1.45;color:var(--ink)}
.score td.tname .tdet{display:none}
.score td.size{font-family:var(--read);font-variant-numeric:lining-nums tabular-nums;color:var(--ink-2);white-space:nowrap}
.score td.tst{white-space:nowrap}
.score tr.task{cursor:pointer}
.score tr.task:hover td{background:var(--surface-2)}
.score tr.task:focus-visible{outline:2px solid var(--accent-line);outline-offset:-2px}
.score tr.task.open td{background:var(--accent-soft);border-bottom-color:transparent}
.score tr.taskedit td{background:var(--accent-soft);padding-top:0}
.tresult{margin-top:3px;font-size:14px;color:var(--ink-2)}
.tresult .md{font-size:14px;line-height:1.45}
.tresult .md > * + *{margin-top:4px}
.te{display:grid;gap:10px;padding:4px 0 10px;max-width:760px}
.te .cmts{margin-top:4px;border-top-color:var(--accent-line)}
.seg3{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:9px;width:max-content;max-width:100%}
.seg3 label{position:relative;cursor:pointer}
.seg3 input{position:absolute;opacity:0;pointer-events:none}
.seg3 span{display:block;padding:4px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg3 label:hover span{background:var(--surface-2)}
.seg3 input:checked + span{background:var(--ink);color:var(--surface)}
.seg3 label.pass input:checked + span{background:var(--ok);color:var(--surface)}
.seg3 label.fail input:checked + span{background:var(--bad);color:var(--surface)}
.seg3 label.mixed input:checked + span{background:var(--warn);color:var(--surface)}
.seg3 input:focus-visible + span{box-shadow:0 0 0 3px var(--accent-line)}
.stage-sheet textarea.tres{font-size:15px;background:var(--surface)}
.tmore summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-3);width:max-content}
.tmore summary:hover{color:var(--accent)}
.tmore[open] summary{margin-bottom:8px}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
.stat::before{content:"";width:9px;height:9px;border-radius:50%;box-sizing:border-box;flex:0 0 auto}
.stat.todo{color:var(--ink-3)} .stat.todo::before{border:1.5px solid var(--ink-3)}
.stat.pass{color:var(--ok)} .stat.pass::before{background:var(--ok)}
.stat.fail{color:var(--bad)} .stat.fail::before{background:var(--bad)}
.stat.mixed{color:var(--warn)} .stat.mixed::before{background:var(--warn)}
.tst .cpill{margin-left:8px}
.legend2{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.legend2 .stat{font-weight:500;font-size:12.5px}
.legend2 .faint{margin-left:auto}
.addrow{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:13px}
#taskform{margin-top:12px}

/* activities */
.acts{display:grid;gap:8px;margin:4px 0 0;padding:0;list-style:none}
.act{border:1px solid var(--line);border-radius:10px;background:var(--surface);scroll-margin-top:12px}
.act:hover{border-color:var(--ink-3)}
.act.open{border-color:var(--ink-3);box-shadow:var(--shadow)}
.ahead{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;border-radius:10px}
.act.open .ahead{padding-bottom:4px}
.ahead:focus-visible{outline:2px solid var(--accent-line);outline-offset:-2px}
.anum{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line-2);font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink-2);flex:0 0 auto}
.act.st-running .anum{background:var(--run-soft);border-color:transparent;color:var(--run)}
.act.st-done .anum{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.aname{flex:1;min-width:0;font-family:var(--read);font-size:16.5px;font-weight:600;line-height:1.3;color:var(--ink)}
.ahead .cpill{margin:0}
.asub{margin:-4px 14px 11px 56px;font-size:13.5px;line-height:1.45;color:var(--ink-3)}
.abody{padding:6px 18px 14px 56px}
.abody > .dsec-head{margin-top:4px}
.abody .notebody{font-size:15.5px;line-height:1.55;margin-top:6px}
.abody .addsec{margin-top:6px}
.asec{margin-top:16px}
.asec > .faint{font-size:13px;margin-top:4px}
.asec code{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line-2);padding:0 5px;border-radius:4px;color:var(--ink)}
.aqs{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.aqs li{display:flex;align-items:baseline;gap:8px;font-size:14.5px}
.aqs li.done .qlink{color:var(--ink-3)}
.qdot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--accent);flex:0 0 auto}
.aqs li.done .qdot{background:var(--ok);border-color:var(--ok)}
.qlink{font-family:var(--read);font-weight:400;color:var(--ink);text-align:left}
.qlink:hover{color:var(--accent)}
.daylinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.daylink{padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:13px;font-weight:600;font-variant-numeric:lining-nums}
.daylink:hover{background:var(--accent-line)}
.aresults{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.aresults li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px}
.aresults .rdate{font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;font-variant-numeric:lining-nums;padding-top:1px}
.aresults .md{font-size:14px}
.atools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:18px;padding-top:12px;border-top:1px solid var(--line-2);font-size:13px}
.stlabel{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.abody .cmts{margin-top:14px}
.abody .addform{margin-top:12px}
a.atag{display:inline-block;padding:0 5px;border-radius:5px;background:var(--accent-soft);color:var(--accent-ink);font-family:var(--mono);font-size:.82em;font-weight:500;text-decoration:none;line-height:1.5;vertical-align:.04em}
a.atag:hover{background:var(--accent-line)}

/* open questions */
.qs,.ths{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:14px}
.q{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;scroll-margin-top:12px}
.q.editing{display:block}
.qmark{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:3px;box-sizing:border-box;background:var(--surface)}
.qmark:hover{background:var(--accent-soft)}
.q.answered .qmark{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.q.answered .qt{color:var(--ink-3)}
.qt{font-family:var(--read);font-size:16px;line-height:1.45;color:var(--ink)}
.qm{display:flex;align-items:baseline;gap:8px;margin-top:4px;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.qm .md{font-family:var(--read);font-size:14.5px;line-height:1.5;color:var(--ink-2);min-width:0}
.qm .md > * + *{margin-top:4px}
.qtag{flex:0 0 auto;padding:0 7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line-2);font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--ink-2);line-height:18px}
.qtag:hover{border-color:var(--accent-line);color:var(--accent)}
.qtools{display:flex;align-items:center;gap:12px;margin-top:3px;font-size:12.5px;opacity:.75}
.q:hover .qtools,.q:focus-within .qtools{opacity:1}
.q .cmts{margin-top:8px}
.qform,.thform{display:grid;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-width:760px}
.ssec > .qform,.ssec > .thform,.asec > .qform{margin:8px 0 10px}
.qform .row{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.chip.qchip{font-family:var(--body);font-size:12px}

/* loose threads */
.th{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;scroll-margin-top:12px}
.th.editing{display:block;border-style:solid;background:var(--surface)}
.tht .md{font-family:var(--read);font-size:15.5px;line-height:1.5;color:var(--ink)}
.tht .md > * + *{margin-top:4px}
.thact{display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-size:12.5px;white-space:nowrap}
.thact .link{font-weight:600;color:var(--ink-3)}
.thact .link:hover{color:var(--accent)}

.stage-sheet > .inside{margin-top:30px}
.stfoot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:22px calc(-1 * var(--sheet-pad)) -30px;padding:12px var(--sheet-pad);border-top:1px solid var(--line-2);background:var(--surface-2);border-radius:0 0 8px 8px}
.importask{margin-top:40px;padding:12px 14px;border-radius:8px;background:var(--hl-soft);font-size:14px;color:var(--ink-2)}
.importask .tools{display:flex;gap:8px;margin-top:8px}
.importask b{color:var(--ink)}
.linkact{font-size:13px;padding:4px 8px;max-width:200px;color:var(--ink-2)}

@media (max-width:760px){
  .sttitle{font-size:24px}
  .stage-sheet{margin-bottom:12px}
  .score th.size,.score td.size{display:none}
  .score td.tname .tdet{display:block;font-size:12.5px;color:var(--ink-3);font-family:var(--body);font-variant-numeric:lining-nums}
  .score th,.score td{padding:8px 6px}
  .score td.tname{font-size:15px}
  .stat{font-size:12px}
  .legend2 .faint{margin-left:0;width:100%}
  .ahead{padding:10px 12px;gap:10px}
  .asub{margin:-4px 12px 10px 12px}
  .abody{padding:4px 12px 12px}
  .th{grid-template-columns:1fr}
  .thact{flex-direction:row;flex-wrap:wrap;gap:4px 14px;align-items:center}
  .stfoot{margin-bottom:-22px}
  .linkact{max-width:150px}
}

/* ---------- the activity page ---------- */
.act-sheet{max-width:900px;margin:0 auto 16px;scroll-margin-top:12px}
.act-sheet .sheetmeta .ofn{color:var(--ink-3)}
.act-sheet .sheethead{padding-bottom:16px}
.act-sheet .dsec{margin-top:26px}
.act-sheet .dsec.empty{margin-top:12px}
.act-sheet .dsec-head .datebtn{color:var(--accent)}
.act-sheet .notebody .md > h3{font-family:var(--display);font-size:17.5px;font-weight:650;letter-spacing:-.005em;color:var(--ink);margin-top:24px;padding-top:16px;border-top:1px solid var(--line-2)}
.act-sheet .notebody .md > h3:first-child{margin-top:4px;padding-top:0;border-top:0}
.act-sheet .dsec[data-asec="lessons"]:not(.empty):not(.editing){margin-top:30px;padding:14px 18px 16px;background:var(--surface-2);border-radius:8px}
.act-sheet .ssec{margin-top:32px}
.act-sheet .ssec code{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line-2);padding:0 5px;border-radius:4px;color:var(--ink)}
.act-sheet .ssec > p.faint{font-size:13px;margin-top:6px}
.act-sheet .daylinks{margin-top:6px}
.act-sheet .daynote + .ssec{padding-top:22px;border-top:1px dashed var(--line)}
.loggedres{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line-2)}
.lrhead{font-size:12.5px;font-weight:700;color:var(--ink-3);margin-bottom:4px}
.acts .act[data-action]{cursor:pointer}
.acts .act .alead b{font-weight:600;color:var(--ink-2)}
.worked{margin-top:18px;padding:10px 14px 11px;border-radius:8px;background:var(--surface-2);border-left:3px solid var(--run)}
.worked .label{font-size:13px;font-weight:700;color:var(--ink-2)}
.worked ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:5px}
.worked li{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;font-size:14.5px}
.wlink{display:inline-flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font-family:var(--read);font-weight:600}
.wlink:hover{color:var(--accent)}
.worked li .faint{font-size:12.5px}
.calside .day .dot.actd{background:var(--run)}
@media (max-width:760px){
  .plantab{overflow:visible}
  .act-sheet{margin-bottom:12px}
  .act-sheet .sheetmeta .ofn{display:none}
}

/* ---------- success criteria checklist ---------- */
.notebody.crit .md li.task{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px}
.notebody.crit .md li.task + li.task{margin-top:2px}
.notebody.crit .md li.task input:checked + span{text-decoration:none;color:var(--ink)}
.crit a.atag{font-family:var(--body);font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;line-height:1.5;vertical-align:.12em}
.crit a.atag .hash{display:none}
.crit a.atag.tag-done{background:var(--ok-soft);color:var(--ok)}
.crit a.atag.tag-done::after{content:" ✓"}
.crit a.atag.tag-running{background:var(--run-soft);color:var(--run)}
.crit a.atag.tag-parked{opacity:.7}
.crittag{font-family:var(--body);font-size:12px;padding:1px 4px;border:1px dashed var(--line);border-radius:6px;background:transparent;color:var(--ink-3);max-width:150px;cursor:pointer}
.crittag:hover,.crittag:focus{border-color:var(--accent-line);color:var(--accent)}
@media (hover:hover){ .crit li.task .crittag{opacity:0;transition:opacity .12s} .crit li.task:hover .crittag,.crit li.task .crittag:focus{opacity:1} }
.crithint{font-size:13px;margin-top:8px}
.crithint code,.mdf .tools code{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line-2);padding:0 5px;border-radius:4px;color:var(--ink)}
.mdf .tools .linkact{font-size:13px;padding:4px 8px;max-width:200px;color:var(--ink-2)}
.certifies{margin-top:16px;padding:10px 14px 11px;border-radius:8px;background:var(--surface-2);border-left:3px solid var(--ok)}
.certifies .label{font-size:13px;font-weight:700;color:var(--ink-2)}
.certifies ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.certifies li{display:flex;align-items:baseline;gap:9px;font-size:15px}
.certifies .ck{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:4px;border:1.5px solid var(--ink-3);font-size:10px;font-weight:700;flex:0 0 auto;transform:translateY(2px);box-sizing:border-box}
.certifies li.met .ck{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.certifies .link{font-family:var(--read);font-weight:400;color:var(--ink);text-align:left}
.certifies .link:hover{color:var(--accent)}

/* ---------- gate ---------- */
.gate{margin:12vh auto 40px;max-width:400px;padding:30px 30px 26px;gap:14px}
.gatebrand{display:flex;align-items:center;gap:12px}
.gatebrand .mark{width:36px;height:36px;color:var(--accent);flex:0 0 auto}
.gatebrand h2{font-family:var(--display);font-size:25px;font-weight:700;margin:0}
.gate .gsub{margin:0;font-size:13.5px;color:var(--ink-3)}

/* ---------- narrower screens ---------- */
@media (max-width:980px) and (min-width:761px){
  .routemain.logs{grid-template-columns:216px minmax(0,1fr);gap:18px}
  .calside{position:sticky}
  :root{--sheet-pad:28px}
}
@media (max-width:760px){
  :root{--sheet-pad:18px}
  .plantab{padding:12px 10px 0}
  .routemain{padding-bottom:40px}
  .routemain.logs{grid-template-columns:minmax(0,1fr);gap:10px}
  .calside{position:static}
  .sheethead{grid-template-columns:1fr}

// ---------- a small Markdown renderer for notes, log entries and comments ----------
// Supports: paragraphs (single newlines break lines), # ## ### headings, - * + bullets, 1. numbered,

function mdPlain(src){

// ---------- the model tree, flattened into reference entries ----------

    case 'thread': return mdPlain(n.text);

      add('revised by', state.log.filter(l => l.kind === 'decision' && l.revises === id).map(l => l.id));
